<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Boros Gym</title>

</head>

<body>

  <h1>BOROS GYM</h1>

  <button onclick="probar()">
    PROBAR CONEXIÓN
  </button>

  <div id="resultado"></div>


<script>

function probar() {

  const script =
    document.createElement("script");


  window.respuestaBoros =
    function(data) {

      document.getElementById(
        "resultado"
      ).innerHTML =

        "<h2>" +
        JSON.stringify(data) +
        "</h2>";

    };


  script.src =
    "https://script.google.com/macros/s/AKfycbwWuTDND-A06UgrvhlZ5Uifo3YsiiuRHbVlPFAGXykmaVQR5h6IuPpehLCLP7KiJYXC/exec" +

    "?api=1" +

    "&id=B001" +

    "&callback=respuestaBoros";


  document.body.appendChild(script);

}

</script>

</body>

</html>
