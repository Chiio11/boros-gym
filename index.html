<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boros Gym - Control de Acceso</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .contenedor {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    /* =========================
       ENCABEZADO
    ========================= */

    .logo {
      text-align: center;
      margin-bottom: 15px;
    }

    .logo-boros {
      font-size: clamp(45px, 9vw, 90px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 8px;
      line-height: 0.9;
      color: white;
      text-shadow:
        4px 4px 0 #d71920,
        0 0 20px rgba(255, 0, 0, 0.35);
    }

    .sublogo {
      margin-top: 10px;
      color: #ef6666;
      font-size: clamp(13px, 3vw, 22px);
      font-weight: bold;
      letter-spacing: 7px;
    }

    h1 {
      text-align: center;
      font-size: clamp(28px, 6vw, 52px);
      margin: 40px 0 30px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    /* =========================
       TARJETA ESCANER
    ========================= */

    .scanner-card {
      width: 100%;
      border: 3px solid #e51c23;
      border-radius: 30px;
      padding: 25px;
      background: linear-gradient(
        145deg,
        #111111,
        #050505
      );
      box-shadow:
        0 0 25px rgba(255, 0, 0, 0.15),
        inset 0 0 30px rgba(255, 0, 0, 0.04);
    }

    .scanner-title {
      text-align: center;
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 900;
      margin-bottom: 20px;
    }

    /* =========================
       CAMARA
    ========================= */

    #reader {
      width: 100%;
      max-width: 850px;
      margin: auto;
      overflow: hidden;
      border-radius: 25px;
      background: #111;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      max-height: 600px;
      object-fit: cover;
      border-radius: 25px;
    }

    #reader__dashboard {
      padding: 10px !important;
    }

    #reader__dashboard_section_csr button,
    #reader__dashboard_section_swaplink {
      font-size: 18px !important;
    }

    /* =========================
       ESTADO
    ========================= */

    .estado {
      text-align: center;
      margin: 25px 0;
    }

    .estado-indicador {
      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #00ff44;
      box-shadow: 0 0 15px #00ff44;
      margin-right: 12px;
      vertical-align: middle;
    }

    .estado-texto {
      color: #39ff68;
      font-size: clamp(22px, 5vw, 38px);
      font-weight: 900;
      vertical-align: middle;
    }

    .estado-ayuda {
      margin-top: 10px;
      color: #aaa;
      font-size: clamp(15px, 3vw, 20px);
    }

    /* =========================
       BOTONES
    ========================= */

    .botones {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 17px 28px;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      background: #e51c23;
      box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
    }

    button:hover {
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    .boton-negro {
      background: #222;
      border: 2px solid #555;
    }

    /* =========================
       BUSQUEDA MANUAL
    ========================= */

    .manual {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #333;
    }

    .manual-titulo {
      text-align: center;
      font-size: 20px;
      color: #ccc;
      margin-bottom: 15px;
    }

    .manual-form {
      display: flex;
      gap: 12px;
      max-width: 700px;
      margin: auto;
    }

    .manual-form input {
      flex: 1;
      min-width: 0;
      padding: 18px;
      border-radius: 15px;
      border: 2px solid #555;
      background: #111;
      color: white;
      font-size: 20px;
      text-align: center;
      outline: none;
    }

    .manual-form input:focus {
      border-color: #e51c23;
    }

    /* =========================
       RESULTADO SOCIO
    ========================= */

    .resultado {
      display: none;
      margin-top: 30px;
      border: 2px solid #444;
      border-radius: 25px;
      padding: 25px;
      background: #111;
    }

    .resultado.visible {
      display: block;
    }

    .socio {
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .foto {
      width: 220px;
      height: 270px;
      border-radius: 20px;
      object-fit: cover;
      background: #222;
      border: 3px solid #333;
    }

    .datos {
      flex: 1;
      min-width: 250px;
    }

    .nombre {
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 900;
      margin-bottom: 20px;
    }

    .dato {
      margin: 12px 0;
      font-size: 20px;
      color: #ccc;
    }

    .dato strong {
      color: white;
    }

    /* =========================
       MENSAJE ACCESO
    ========================= */

    .acceso {
      margin-top: 25px;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 900;
    }

    .permitido {
      border: 2px solid #00d639;
      color: #25ff55;
      background: rgba(0, 180, 40, 0.08);
      box-shadow: 0 0 20px rgba(0, 255, 60, 0.1);
    }

    .denegado {
      border: 2px solid #ff2020;
      color: #ff4444;
      background: rgba(255, 0, 0, 0.08);
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      display: none;
      margin-top: 20px;
      padding: 25px;
      border: 2px solid #ff2020;
      border-radius: 20px;
      color: #ff5555;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .error.visible {
      display: block;
    }

    /* =========================
       CONTADORES
    ========================= */

    .contadores {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .contador {
      border: 2px solid #333;
      border-radius: 20px;
      padding: 25px 10px;
      text-align: center;
      background: #0d0d0d;
    }

    .contador-numero {
      font-size: clamp(30px, 6vw, 50px);
      font-weight: 900;
    }

    .contador-texto {
      margin-top: 8px;
      color: #aaa;
      font-size: 15px;
      font-weight: bold;
    }

    .verde {
      color: #00ff44;
    }

    .rojo {
      color: #ff3030;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #aaa;
      font-size: 16px;
      letter-spacing: 3px;
    }

    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 700px) {

      .contenedor {
        padding: 15px 10px 40px;
      }

      .scanner-card {
        padding: 15px;
        border-radius: 22px;
      }

      .manual-form {
        flex-direction: column;
      }

      .manual-form button {
        width: 100%;
      }

      .contadores {
        gap: 8px;
      }

      .contador {
        padding: 18px 5px;
      }

      .contador-texto {
        font-size: 12px;
      }

      .socio {
        flex-direction: column;
        text-align: center;
      }

      .foto {
        width: min(80vw, 280px);
        height: 330px;
      }

      .datos {
        width: 100%;
      }

      #reader {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <!-- =========================
       LOGO
  ========================== -->

  <div class="logo">
    <div class="logo-boros">BOROS</div>
    <div class="sublogo">STRENGTH & FITNESS</div>
  </div>

  <h1>CONTROL DE ACCESO</h1>

  <!-- =========================
       ESCANER
  ========================== -->

  <div class="scanner-card">

    <div class="scanner-title">
      📷 ESCÁNER QR
    </div>

    <div id="reader"></div>

    <div class="estado">
      <span class="estado-indicador"></span>
      <span class="estado-texto" id="estadoTexto">
        LISTO PARA ESCANEAR
      </span>

      <div class="estado-ayuda">
        Presentá el QR del socio frente a la cámara
      </div>
    </div>

    <div class="botones">

      <button onclick="iniciarCamara()">
        📷 ABRIR CÁMARA
      </button>

      <button
        class="boton-negro"
        onclick="detenerCamara()">
        ⏹ DETENER
      </button>

    </div>

    <!-- =========================
         BUSQUEDA MANUAL
    ========================== -->

    <div class="manual">

      <div class="manual-titulo">
        Si el QR no funciona, ingresá el ID del socio manualmente
      </div>

      <div class="manual-form">

        <input
          type="text"
          id="idManual"
          placeholder="Ejemplo: B001"
          autocomplete="off">

        <button onclick="buscarManual()">
          🔎 BUSCAR
        </button>

      </div>

    </div>

  </div>

  <!-- =========================
       ERROR
  ========================== -->

  <div id="error" class="error"></div>

  <!-- =========================
       RESULTADO
  ========================== -->

  <div id="resultado" class="resultado">

    <div class="socio">

      <img
        id="fotoSocio"
        class="foto"
        src=""
        alt="Foto del socio">

      <div class="datos">

        <div
          id="nombreSocio"
          class="nombre">
        </div>

        <div class="dato">
          <strong>ID:</strong>
          <span id="idSocio"></span>
        </div>

        <div class="dato">
          <strong>DNI:</strong>
          <span id="dniSocio"></span>
        </div>

        <div class="dato">
          <strong>PLAN:</strong>
          <span id="planSocio"></span>
        </div>

        <div class="dato">
          <strong>VENCIMIENTO:</strong>
          <span id="vencimientoSocio"></span>
        </div>

      </div>

    </div>

    <div
      id="acceso"
      class="acceso">
    </div>

  </div>

  <!-- =========================
       CONTADORES
  ========================== -->

  <div class="contadores">

    <div class="contador">

      <div
        id="entradas"
        class="contador-numero">
        0
      </div>

      <div class="contador-texto">
        ENTRADAS HOY
      </div>

    </div>

    <div class="contador">

      <div
        id="permitidas"
        class="contador-numero verde">
        0
      </div>

      <div class="contador-texto">
        PERMITIDAS
      </div>

    </div>

    <div class="contador">

      <div
        id="denegadas"
        class="contador-numero rojo">
        0
      </div>

      <div class="contador-texto">
        DENEGADAS
      </div>

    </div>

  </div>

  <div class="footer">
    BOROS • FUERZA • DISCIPLINA • RESULTADOS
  </div>

</div>


<!-- =====================================================
     LIBRERÍA QR
===================================================== -->

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<script>

  /* =====================================================
     URL DE APPS SCRIPT
  ===================================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwWuTDND-A06UgrvhlZ5Uifo3YsiiuRHbVlPFAGXykmaVQR5h6IuPpehLCLP7KiJYXC/exec";


  /* =====================================================
     VARIABLES
  ===================================================== */

  let scanner = null;
  let escaneando = false;
  let procesando = false;

  let entradas = 0;
  let permitidas = 0;
  let denegadas = 0;


  /* =====================================================
     ELEMENTOS
  ===================================================== */

  const estadoTexto =
    document.getElementById("estadoTexto");

  const errorBox =
    document.getElementById("error");

  const resultado =
    document.getElementById("resultado");


  /* =====================================================
     MOSTRAR ERROR
  ===================================================== */

  function mostrarError(mensaje) {

    errorBox.textContent = mensaje;

    errorBox.classList.add("visible");

  }


  function ocultarError() {

    errorBox.classList.remove("visible");

  }


  /* =====================================================
     INICIAR CÁMARA
  ===================================================== */

  async function iniciarCamara() {

    ocultarError();

    if (escaneando) {
      return;
    }

    try {

      if (!scanner) {

        scanner =
          new Html5Qrcode("reader");

      }

      const config = {

        fps: 10,

        qrbox: function(width, height) {

          const lado =
            Math.min(width, height) * 0.70;

          return {
            width: lado,
            height: lado
          };

        },

        aspectRatio: 1.0

      };


      await scanner.start(

        { facingMode: "environment" },

        config,

        function(decodedText) {

          procesarQR(decodedText);

        },

        function(errorMessage) {

          // No mostramos los errores normales
          // mientras la cámara está buscando.

        }

      );


      escaneando = true;

      estadoTexto.textContent =
        "LISTO PARA ESCANEAR";

    }

    catch (error) {

      console.error(error);

      mostrarError(
        "NO SE PUDO ACCEDER A LA CÁMARA. " +
        "Revisá los permisos del navegador."
      );

    }

  }


  /* =====================================================
     DETENER CÁMARA
  ===================================================== */

  async function detenerCamara() {

    try {

      if (scanner && escaneando) {

        await scanner.stop();

        scanner.clear();

      }

    } catch (error) {

      console.log(error);

    }

    escaneando = false;

  }


  /* =====================================================
     QR DETECTADO
  ===================================================== */

  function procesarQR(texto) {

    if (procesando) {
      return;
    }

    procesando = true;

    let id = String(texto).trim();

    /*
      Si el QR contiene una URL con ?id=B001,
      también podemos obtener automáticamente el ID.
    */

    try {

      if (
        id.startsWith("http://") ||
        id.startsWith("https://")
      ) {

        const url =
          new URL(id);

        const idURL =
          url.searchParams.get("id");

        if (idURL) {
          id = idURL;
        }

      }

    } catch (e) {

      // Si no es una URL, usamos directamente el texto.

    }


    id =
      id
        .trim()
        .toUpperCase();


    estadoTexto.textContent =
      "QR DETECTADO: " + id;


    consultarSocio(id);

  }


  /* =====================================================
     BUSCAR MANUAL
  ===================================================== */

  function buscarManual() {

    const input =
      document.getElementById("idManual");

    const id =
      input.value.trim().toUpperCase();

    if (!id) {

      mostrarError(
        "INGRESÁ EL ID DEL SOCIO."
      );

      return;

    }

    ocultarError();

    consultarSocio(id);

  }


  /* =====================================================
     ENTER EN EL INPUT
  ===================================================== */

  document
    .getElementById("idManual")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          buscarManual();

        }

      }
    );


  /* =====================================================
     CONSULTAR APPS SCRIPT
     
     USAMOS JSONP PARA EVITAR CORS
  ===================================================== */

  function consultarSocio(id) {

    ocultarError();

    estadoTexto.textContent =
      "CONSULTANDO SOCIO...";


    const callbackName =
      "borosCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);


    const script =
      document.createElement("script");


    let terminado = false;


    /* =========================
       RESPUESTA
    ========================= */

    window[callbackName] =
      function(data) {

        terminado = true;

        try {

          mostrarResultado(data);

        } catch (error) {

          console.error(error);

          mostrarError(
            "ERROR AL PROCESAR LA RESPUESTA."
          );

        }

        limpiar();

      };


    /* =========================
       ERROR DE RED
    ========================= */

    script.onerror =
      function() {

        if (terminado) {
          return;
        }

        mostrarError(
          "NO SE PUDO CONECTAR CON EL SISTEMA. " +
          "Revisá la conexión a internet y la publicación de Apps Script."
        );

        estadoTexto.textContent =
          "LISTO PARA ESCANEAR";

        limpiar();

      };


    /* =========================
       URL JSONP
    ========================= */

    const url =
      API_URL +
      "?api=1" +
      "&id=" +
      encodeURIComponent(id) +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();


    script.src = url;


    document
      .body
      .appendChild(script);


    /* =========================
       TIMEOUT
    ========================= */

    setTimeout(function() {

      if (!terminado) {

        mostrarError(
          "EL SISTEMA TARDÓ DEMASIADO EN RESPONDER."
        );

        estadoTexto.textContent =
          "LISTO PARA ESCANEAR";

        limpiar();

      }

    }, 15000);


    /* =========================
       LIMPIAR
    ========================= */

    function limpiar() {

      terminado = true;

      if (script.parentNode) {

        script.parentNode.removeChild(script);

      }

      try {

        delete window[callbackName];

      } catch (e) {

        window[callbackName] =
          undefined;

      }

      procesando = false;

    }

  }


  /* =====================================================
     MOSTRAR RESULTADO
  ===================================================== */

  function mostrarResultado(data) {

    console.log(
      "Respuesta Apps Script:",
      data
    );


    if (!data) {

      mostrarError(
        "EL SISTEMA DEVOLVIÓ UNA RESPUESTA VACÍA."
      );

      return;

    }


    if (!data.encontrado) {

      resultado.classList.remove(
        "visible"
      );

      mostrarError(
        data.mensaje ||
        "SOCIO NO ENCONTRADO"
      );

      estadoTexto.textContent =
        "LISTO PARA ESCANEAR";

      return;

    }


    /* =========================
       DATOS
    ========================= */

    document
      .getElementById("nombreSocio")
      .textContent =
        (data.nombre || "") +
        " " +
        (data.apellido || "");


    document
      .getElementById("idSocio")
      .textContent =
        data.id || "";


    document
      .getElementById("dniSocio")
      .textContent =
        data.dni || "";


    document
      .getElementById("planSocio")
      .textContent =
        data.plan || "";


    document
      .getElementById("vencimientoSocio")
      .textContent =
        data.vencimiento || "";


    /* =========================
       FOTO
    ========================= */

    const foto =
      document.getElementById("fotoSocio");


    if (
      data.foto &&
      data.foto.datos
    ) {

      foto.src =
        "data:" +
        data.foto.tipo +
        ";base64," +
        data.foto.datos;

    } else {

      foto.src =
        "data:image/svg+xml," +
        encodeURIComponent(
          `
          <svg xmlns="http://www.w3.org/2000/svg"
               width="300"
               height="400">
            <rect width="100%"
                  height="100%"
                  fill="#222"/>
            <text x="50%"
                  y="50%"
                  dominant-baseline="middle"
                  text-anchor="middle"
                  fill="#777"
                  font-size="24">
              SIN FOTO
            </text>
          </svg>
          `
        );

    }


    /* =========================
       ACCESO
    ========================= */

    const acceso =
      document.getElementById("acceso");


    if (data.permitido) {

      acceso.textContent =
        "✓ ACCESO PERMITIDO";

      acceso.className =
        "acceso permitido";

      permitidas++;

    } else {

      acceso.textContent =
        "✕ ACCESO DENEGADO";

      acceso.className =
        "acceso denegado";

      denegadas++;

    }


    entradas++;


    actualizarContadores();


    resultado.classList.add(
      "visible"
    );


    estadoTexto.textContent =
      "LISTO PARA ESCANEAR";


    /* =========================
       VOLVER A ESCANEAR
    ========================= */

    setTimeout(function() {

      procesando = false;

    }, 2000);

  }


  /* =====================================================
     CONTADORES
  ===================================================== */

  function actualizarContadores() {

    document
      .getElementById("entradas")
      .textContent =
        entradas;


    document
      .getElementById("permitidas")
      .textContent =
        permitidas;


    document
      .getElementById("denegadas")
      .textContent =
        denegadas;

  }


  /* =====================================================
     INICIO
  ===================================================== */

  window.addEventListener(
    "load",
    function() {

      estadoTexto.textContent =
        "LISTO PARA ESCANEAR";

    }
  );

</script>

</body>
</html>
