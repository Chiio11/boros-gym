<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Boros Gym - Control de Acceso</title>

  <!-- Lector QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    /* LOGO */

    .logo {
      text-align: center;
      font-size: 58px;
      font-weight: 1000;
      font-style: italic;
      letter-spacing: 8px;
      color: white;
      text-shadow:
        4px 4px 0 #b00000,
        0 0 20px rgba(220,0,0,.5);
      margin-top: 10px;
    }

    .sublogo {
      text-align: center;
      color: #e00000;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 6px;
      margin-top: 5px;
    }

    .titulo {
      text-align: center;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
      margin: 20px 0;
    }

    /* ESCANER */

    .scanner {
      background: #0d0d0d;
      border: 2px solid #d00000;
      border-radius: 25px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(210,0,0,.2);
    }

    .scannerTitulo {
      text-align: center;
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: auto;
      border-radius: 20px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      border-radius: 18px;
    }

    /* BOTON */

    #botonCamara {
      width: 100%;
      min-height: 75px;
      margin-top: 15px;
      border: none;
      border-radius: 18px;
      background: #d00000;
      color: white;
      font-size: 23px;
      font-weight: 900;
      cursor: pointer;
    }

    #botonCamara:active {
      transform: scale(.98);
    }

    #estadoCamara {
      text-align: center;
      margin-top: 13px;
      font-size: 17px;
      font-weight: bold;
      color: #aaa;
    }

    /* RESULTADO */

    #resultado {
      margin-top: 20px;
    }

    .socio {
      background: #0d0d0d;
      border: 2px solid #333;
      border-radius: 25px;
      padding: 20px;
    }

    .foto {
      display: block;
      width: 100%;
      max-width: 340px;
      max-height: 430px;
      object-fit: cover;
      margin: 0 auto 20px;
      border-radius: 20px;
      border: 3px solid #a00000;
    }

    .nombre {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .dato {
      background: #171717;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      font-size: 20px;
    }

    .dato b {
      display: block;
      color: #999;
      font-size: 13px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .acceso {
      text-align: center;
      font-size: 28px;
      font-weight: 1000;
      padding: 23px 10px;
      margin-top: 20px;
      border-radius: 18px;
      border: 2px solid;
    }

    .permitido {
      color: #00ff48;
      border-color: #00a832;
      background: rgba(0,150,50,.12);
    }

    .denegado {
      color: #ff2222;
      border-color: #b00000;
      background: rgba(180,0,0,.12);
    }

    .error {
      text-align: center;
      padding: 35px 15px;
      border: 2px solid #b00000;
      border-radius: 20px;
      color: #ff2222;
      font-size: 25px;
      font-weight: 900;
      background: #100000;
    }

    /* ESTADISTICAS */

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .stat {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 15px;
      text-align: center;
      padding: 15px 5px;
    }

    .numero {
      font-size: 29px;
      font-weight: 900;
    }

    .texto {
      color: #999;
      font-size: 11px;
      font-weight: bold;
      margin-top: 5px;
    }

    .verde {
      color: #00e640;
    }

    .rojo {
      color: #e00000;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .footer strong {
      color: #d00000;
    }

    /* CELULAR */

    @media(max-width:600px) {

      .app {
        padding: 15px 10px 35px;
      }

      .logo {
        font-size: 47px;
        letter-spacing: 6px;
      }

      .sublogo {
        font-size: 10px;
        letter-spacing: 4px;
      }

      .titulo {
        font-size: 22px;
      }

      .scanner {
        padding: 12px;
      }

      .scannerTitulo {
        font-size: 21px;
      }

      #botonCamara {
        min-height: 80px;
        font-size: 22px;
      }

      .nombre {
        font-size: 27px;
      }

      .dato {
        font-size: 19px;
      }

      .acceso {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>

<div class="app">

  <div class="logo">
    BOROS
  </div>

  <div class="sublogo">
    STRENGTH & FITNESS
  </div>

  <div class="titulo">
    CONTROL DE ACCESO
  </div>


  <!-- ESCANER -->

  <div class="scanner">

    <div class="scannerTitulo">
      📷 ESCÁNER QR
    </div>

    <div id="reader"></div>

    <button
      id="botonCamara"
      onclick="activarCamara()">

      📷 ACTIVAR CÁMARA

    </button>

    <div id="estadoCamara">

      Tocá el botón para comenzar

    </div>

  </div>


  <!-- RESULTADO -->

  <div id="resultado"></div>


  <!-- ESTADISTICAS -->

  <div class="estadisticas">

    <div class="stat">

      <div
        id="entradas"
        class="numero">
        0
      </div>

      <div class="texto">
        ENTRADAS HOY
      </div>

    </div>


    <div class="stat">

      <div
        id="permitidas"
        class="numero verde">
        0
      </div>

      <div class="texto">
        PERMITIDAS
      </div>

    </div>


    <div class="stat">

      <div
        id="denegadas"
        class="numero rojo">
        0
      </div>

      <div class="texto">
        DENEGADAS
      </div>

    </div>

  </div>


  <div class="footer">

    💪 <strong>FUERZA</strong>
    • DISCIPLINA •
    <strong>RESULTADOS</strong>

  </div>

</div>


<script>

  /* =========================
     CONFIGURACION
  ========================= */

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwWuTDND-A06UgrvhlZ5Uifo3YsiiuRHbVlPFAGXykmaVQR5h6IuPpehLCLP7KiJYXC/exec";


  let scanner = null;

  let camaraActiva = false;

  let procesando = false;

  let entradas = 0;

  let permitidas = 0;

  let denegadas = 0;


  /* =========================
     ACTIVAR CAMARA
  ========================= */

  function activarCamara() {

    if (camaraActiva) {
      return;
    }


    const estado =
      document.getElementById("estadoCamara");

    const boton =
      document.getElementById("botonCamara");


    estado.innerText =
      "Solicitando permiso para usar la cámara...";

    boton.disabled = true;

    boton.innerText =
      "📷 ACTIVANDO...";


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(width,height) * 0.75
            );

          return {
            width: size,
            height: size
          };

        }

      },

      function(texto) {

        procesarQR(texto);

      },

      function() {

        // errores normales de lectura

      }

    )

    .then(function() {

      camaraActiva = true;

      estado.innerText =
        "🟢 LISTO PARA ESCANEAR";

      estado.style.color =
        "#00ff48";

      boton.innerText =
        "📷 CÁMARA ACTIVADA";

    })

    .catch(function(error) {

      console.log(error);

      estado.innerText =
        "🔴 NO SE PUDO ACCEDER A LA CÁMARA";

      estado.style.color =
        "#ff2222";

      boton.disabled = false;

      boton.innerText =
        "📷 INTENTAR NUEVAMENTE";

    });

  }


  /* =========================
     PROCESAR QR
  ========================= */

  function procesarQR(texto) {

    if (procesando) {
      return;
    }

    procesando = true;


    let id =
      String(texto)
        .trim()
        .toUpperCase();


    /*
      Si el QR contiene una URL
      con ?id=B001
    */

    try {

      if (id.includes("?")) {

        const url =
          new URL(id);

        const parametro =
          url.searchParams.get("id");

        if (parametro) {

          id =
            parametro
              .trim()
              .toUpperCase();

        }

      }

    } catch(e) {

      // Es un QR de texto normal

    }


    mostrarVerificando();


    /*
      IMPORTANTE:

      Usamos JSONP porque una página
      de GitHub no puede hacer una
      petición fetch normal a Apps Script
      por las restricciones CORS.
    */


    const callback =
      "respuestaBoros_" +
      Date.now();


    window[callback] =
      function(resultado) {

        mostrarSocio(resultado);

        delete window[callback];

        procesando = false;

      };


    const script =
      document.createElement("script");


    script.src =
      URL_APPS_SCRIPT +
      "?api=1&id=" +
      encodeURIComponent(id) +
      "&callback=" +
      callback;


    script.onerror =
      function() {

        mostrarError(
          "No se pudo conectar con el sistema"
        );

        delete window[callback];

        procesando = false;

      };


    document.body.appendChild(script);


    setTimeout(function() {

      if (document.body.contains(script)) {

        document.body.removeChild(script);

      }

    }, 15000);

  }


  /* =========================
     VERIFICANDO
  ========================= */

  function mostrarVerificando() {

    document.getElementById(
      "resultado"
    ).innerHTML =

      '<div class="scanner">' +

        '<div style="font-size:55px;text-align:center;">🔍</div>' +

        '<div style="font-size:25px;font-weight:900;text-align:center;">' +

          'VERIFICANDO...' +

        '</div>' +

        '<div style="text-align:center;color:#aaa;margin-top:8px;">' +

          'Buscando socio en el sistema' +

        '</div>' +

      '</div>';

  }


  /* =========================
     MOSTRAR SOCIO
  ========================= */

  function mostrarSocio(resultado) {

    if (
      !resultado ||
      !resultado.encontrado
    ) {

      entradas++;

      denegadas++;

      actualizarEstadisticas();


      document.getElementById(
        "resultado"
      ).innerHTML =

        '<div class="error">' +

          '🔴<br><br>' +

          'SOCIO NO ENCONTRADO' +

        '</div>';


      limpiarResultado();

      return;

    }


    entradas++;


    if (resultado.permitido) {

      permitidas++;

    } else {

      denegadas++;

    }


    actualizarEstadisticas();


    let foto = "";


    if (
      resultado.foto &&
      resultado.foto.datos
    ) {

      foto =

        '<img class="foto" src="data:' +

        resultado.foto.tipo +

        ';base64,' +

        resultado.foto.datos +

        '" alt="Foto del socio">';

    }


    const clase =
      resultado.permitido
        ? "permitido"
        : "denegado";


    const icono =
      resultado.permitido
        ? "🟢"
        : "🔴";


    document.getElementById(
      "resultado"
    ).innerHTML =

      '<div class="socio">' +

        foto +

        '<div class="nombre">' +

          resultado.nombre +

          ' ' +

          resultado.apellido +

        '</div>' +


        '<div class="dato">' +

          '<b>ID SOCIO</b>' +

          resultado.id +

        '</div>' +


        '<div class="dato">' +

          '<b>PLAN</b>' +

          resultado.plan +

        '</div>' +


        '<div class="dato">' +

          '<b>VENCIMIENTO</b>' +

          resultado.vencimiento +

        '</div>' +


        '<div class="dato">' +

          '<b>DNI</b>' +

          resultado.dni +

        '</div>' +


        '<div class="acceso ' +

          clase +

          '">' +

          icono +

          ' ' +

          resultado.mensaje +

        '</div>' +


        '<div style="text-align:center;color:#999;margin-top:12px;">' +

          'Entrada registrada correctamente' +

        '</div>' +

      '</div>';


    limpiarResultado();

  }


  /* =========================
     ERROR
  ========================= */

  function mostrarError(mensaje) {

    document.getElementById(
      "resultado"
    ).innerHTML =

      '<div class="error">' +

        '🔴<br><br>' +

        'ERROR' +

        '<div style="font-size:15px;color:#aaa;margin-top:15px;">' +

          mensaje +

        '</div>' +

      '</div>';

  }


  /* =========================
     LIMPIAR
  ========================= */

  function limpiarResultado() {

    setTimeout(function() {

      document.getElementById(
        "resultado"
      ).innerHTML = "";

    }, 5000);

  }


  /* =========================
     ESTADISTICAS
  ========================= */

  function actualizarEstadisticas() {

    document.getElementById(
      "entradas"
    ).innerText = entradas;


    document.getElementById(
      "permitidas"
    ).innerText = permitidas;


    document.getElementById(
      "denegadas"
    ).innerText = denegadas;

  }

</script>

</body>
</html>
