<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boros Gym - Control de Acceso</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.contenedor{width:100%;max-width:1100px;margin:auto;padding:25px 20px 40px}
/* ===== LOGO BOROS ===== */

.logo {
    text-align: center;
    margin-bottom: 20px;
    padding-top: 10px;
    position: relative;
}

.logo-principal {
    font-size: clamp(65px, 11vw, 120px);
    font-weight: 1000;
    font-style: normal;
    letter-spacing: 8px;
    line-height: 0.9;
    color: #ff1515;

    text-shadow:
        0 0 5px rgba(255, 0, 0, 0.8),
        0 0 15px rgba(255, 0, 0, 0.45),
        0 0 35px rgba(255, 0, 0, 0.2);
}

.logo-sub {
    margin-top: 12px;
    color: #ff2020;
    font-size: clamp(18px, 3vw, 30px);
    font-weight: 1000;
    letter-spacing: 8px;
    text-transform: uppercase;
}

.logo-frase {
    margin-top: 12px;
    color: #ff2020;
    font-size: clamp(12px, 2vw, 18px);
    font-weight: 900;
    letter-spacing: 4px;
}

/* ===== LOGO BOROS ===== */

.logo {
    text-align: center;
    margin: 0 auto 20px;
    padding-top: 5px;
    position: relative;
}

.logo img {
    width: 100%;
    max-width: 300px;
    height: auto;
    display: block;
    margin: 0 auto;
}

 .logo-icono {
    font-size: clamp(55px, 9vw, 100px);
    line-height: 1;
    margin-bottom: 5px;
    filter: grayscale(1) brightness(0.9);
}
    .logo-icono img {
    width: min(90%, 700px);
    max-height: 300px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
}
/* =====================================================
   DISEÑO BOROS - CONTROL DE ACCESO
===================================================== */

.titulo {
    text-align: center;
    font-size: clamp(32px, 6vw, 58px);
    font-weight: 900;
    margin: 20px 0 30px;
    letter-spacing: 2px;
    position: relative;
}

.titulo::before,
.titulo::after {
    content: "";
    display: inline-block;
    width: 100px;
    height: 2px;
    background: #ff1515;
    vertical-align: middle;
    margin: 0 20px;
    box-shadow: 0 0 10px rgba(255,0,0,.5);
}


/* =====================================================
   PANEL PRINCIPAL
===================================================== */

.paneles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    align-items: stretch;
    box-sizing: border-box;
}
.paneles .scanner-card,
.paneles #resultado {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
}


/* =====================================================
   ESCÁNER
===================================================== */

.scanner-card {
    width: 100%;
    border: 2px solid #d90000;
    border-radius: 20px;
    padding: 20px;
    background:
        linear-gradient(145deg, #090909, #020202);
    box-shadow:
        0 0 20px rgba(255,0,0,.12),
        inset 0 0 20px rgba(255,0,0,.03);
}

.scanner-titulo {
    text-align: center;
    font-size: clamp(24px,4vw,36px);
    font-weight: 900;
    margin-bottom: 20px;
    color: #ff2020;
    letter-spacing: 1px;
}

#reader {
    width: 100%;
    max-width: 600px;
    margin: auto;
    border-radius: 18px;
    overflow: hidden;
    background: #050505;
}

#reader img {
    max-width: 100%;
}

#reader video {
    width: 100%!important;
    height: auto!important;
    border-radius: 15px;
}

.estado {
    text-align: center;
    margin-top: 18px;
    font-size: clamp(20px,4vw,30px);
    font-weight: 900;
    color: #00ed45;
}

.ayuda {
    text-align: center;
    margin-top: 8px;
    color: #aaa;
    font-size: 16px;
}


/* =====================================================
   BOTONES
===================================================== */

.controles {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.boton {
    border: none;
    border-radius: 10px;
    padding: 14px 22px;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    color: #fff;
    background: #ed1c24;
    transition: .2s;
}

.boton:hover {
    background: #ff3030;
    transform: translateY(-1px);
}

.boton.secundario {
    background: #111;
    border: 1px solid #555;
}


/* =====================================================
   BÚSQUEDA MANUAL
===================================================== */

.manual {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid #333;
}

.manual-titulo {
    text-align: center;
    font-size: 16px;
    margin-bottom: 12px;
    color: #ccc;
}

.manual-contenedor {
    display: flex;
    gap: 8px;
}

#idManual {
    flex: 1;
    min-width: 0;
    background: #0b0b0b;
    color: #fff;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 14px;
    font-size: 18px;
    text-transform: uppercase;
}

#buscarManual {
    background: #ed1c24;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
}


/* =====================================================
   RESULTADO
===================================================== */

#resultado {
    height: 100%;
}

.socio-card {
    height: 100%;
    background:
        linear-gradient(145deg,#090909,#020202);
    border: 2px solid #d90000;
    border-radius: 20px;
    padding: 20px;
    box-shadow:
        0 0 20px rgba(255,0,0,.12),
        inset 0 0 20px rgba(255,0,0,.03);
}

.socio-contenido {
    display: flex;
    align-items: center;
    gap: 20px;
}

.foto-container {
    width: 180px;
    flex-shrink: 0;
}

.foto {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 15px;
    border: 2px solid #e51b23;
}

.datos {
    flex: 1;
}

.nombre {
    font-size: clamp(24px,4vw,36px);
    font-weight: 900;
    margin-bottom: 15px;
}

.dato {
    padding: 9px 0;
    border-bottom: 1px solid #292929;
    font-size: 18px;
}

.dato span {
    display: block;
    color: #777;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 3px;
}


/* =====================================================
   ESTADO DE ACCESO
===================================================== */

.acceso {
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    font-size: clamp(24px,4vw,36px);
    font-weight: 900;
}

.acceso small {
    display: block;
    margin-top: 8px;
    color: #aaa;
    font-size: 15px;
    font-weight: normal;
}

.permitido {
    color: #00ed45;
    border: 2px solid #00a832;
    background: rgba(0,180,60,.08);
}

.denegado {
    color: #ff3030;
    border: 2px solid #b00000;
    background: rgba(180,0,0,.08);
}

.error {
    height: 100%;
    min-height: 250px;
    background: #080000;
    border: 2px solid #d00000;
    border-radius: 20px;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    color: #ff4040;
    font-size: clamp(20px,3vw,30px);
    font-weight: 900;
}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

.estadisticas {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    margin-top: 18px;
}

.estadistica {
    background: #080808;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 18px 10px;
    text-align: center;
    color: #888;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.numero {
    display: block;
    margin-top: 7px;
    color: #fff;
    font-size: 38px;
    font-weight: 900;
}

.verde {
    color: #00ed45;
}

.rojo {
    color: #ff3030;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    text-align: center;
    margin-top: 22px;
    color: #555;
    font-size: 12px;
    letter-spacing: 3px;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px) {

    .contenedor {
        padding: 15px 10px 30px;
    }

    .titulo {
        font-size: 32px;
        margin: 15px 0 20px;
    }

    .titulo::before,
    .titulo::after {
        width: 25px;
        margin: 0 8px;
    }

    .paneles {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .scanner-card {
        padding: 12px;
        border-radius: 18px;
    }

    .scanner-titulo {
        margin-bottom: 12px;
    }

    #reader {
        border-radius: 15px;
    }

    .socio-contenido {
        flex-direction: column;
    }

    .foto-container {
        width: 70%;
        max-width: 260px;
    }

    .datos {
        width: 100%;
        text-align: center;
    }

    .dato {
        text-align: left;
    }

    .manual-contenedor {
        flex-direction: column;
    }

    #buscarManual {
        min-height: 55px;
    }

    .estadisticas {
        gap: 7px;
    }

    .estadistica {
        padding: 14px 5px;
        font-size: 10px;
    }

    .numero {
        font-size: 30px;
    }
}
@media(max-width:650px){
 .contenedor{padding:18px 10px 30px}
 .scanner-card{padding:12px;border-radius:25px}
 .scanner-titulo{margin-bottom:15px}
 #reader{border-radius:18px}
 .socio-contenido{flex-direction:column}
 .foto-container{width:85%;max-width:330px}
 .datos{width:100%;text-align:center}
 .dato{text-align:left}
 .manual-contenedor{flex-direction:column}
 #buscarManual{min-height:60px}
 .estadisticas{gap:7px}
 .estadistica{padding:15px 5px;font-size:11px}
 .numero{font-size:30px}
}
</style>
</head>

<body>
<div class="contenedor">

<!-- LOGO BOROS -->
<div class="logo">
    <img src="logo-boros.png" alt="BOROS Fitness Gym">
</div>

<div class="titulo">CONTROL DE ACCESO</div>


<div class="paneles">

    <!-- ESCÁNER -->
<div class="scanner-card">
  <div class="scanner-titulo">📷 ESCÁNER QR</div>

  <div id="reader"></div>

  <div id="estadoCamara" class="estado">⚪ TOCÁ «ABRIR CÁMARA»</div>

  <div class="ayuda">Presentá el QR del socio frente a la cámara</div>

  <div class="controles">
    <button class="boton" id="abrirCamara">📷 ABRIR CÁMARA</button>
    <button class="boton secundario" id="detenerCamara">⏹️ DETENER</button>
  </div>

  <div class="manual">
    <div class="manual-titulo">Si el QR no funciona, ingresá el ID del socio manualmente</div>

    <div class="manual-contenedor">
      <input id="idManual" type="text" placeholder="Ejemplo: B001" autocomplete="off">
      <button id="buscarManual">🔎 BUSCAR</button>
    </div>
  </div>
</div>

    <!-- RESULTADO -->
    <div id="resultado">
        ...
    </div>

</div>

    <div id="resultado">

        <div class="socio-card">

            <div class="acceso">
                👤<br><br>
                ESCANEÁ UN QR
                <small>
                    o buscá un socio manualmente
                </small>
            </div>

        </div>

    </div>

</div>

<div class="estadisticas">
  <div class="estadistica">ENTRADAS HOY<span id="entradasHoy" class="numero">0</span></div>
  <div class="estadistica">PERMITIDAS<span id="permitidas" class="numero verde">0</span></div>
  <div class="estadistica">DENEGADAS<span id="denegadas" class="numero rojo">0</span></div>
</div>

<div class="footer">BOROS • FUERZA • DISCIPLINA • RESULTADOS</div>

</div>

<script>
/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwVF61K5oldfMH1murcWrLTKjzrR78MwmBHPb4mA6kv3X2SjEKwXrRSfwSxkid7IrD_/exec";

/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;
let camaraActiva = false;
let procesando = false;

let entradasHoy = 0;
let permitidas = 0;
let denegadas = 0;

/* =====================================================
   ELEMENTOS
===================================================== */

const estadoCamara = document.getElementById("estadoCamara");
const resultado = document.getElementById("resultado");
const idManual = document.getElementById("idManual");

/* =====================================================
   CÁMARA
===================================================== */

async function iniciarCamara() {

  if (camaraActiva) return;

  estadoCamara.innerText = "🟡 SOLICITANDO CÁMARA...";
  estadoCamara.style.color = "#ffd000";

  try {

    if (scanner) {
      try { await scanner.stop(); } catch(e) {}
      try { scanner.clear(); } catch(e) {}
      scanner = null;
    }

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: function(width,height) {
          const size = Math.floor(Math.min(width,height) * 0.75);
          return {width:size,height:size};
        },
        aspectRatio: 1.0
      },
      function(decodedText) {

        if (procesando) return;

        procesando = true;

        console.log("📷 QR DETECTADO:", decodedText);

        estadoCamara.innerText = "🟡 QR DETECTADO — VERIFICANDO...";
        estadoCamara.style.color = "#ffd000";

        procesarQR(decodedText);
      },
      function(errorMessage) {
        // Normal: el lector busca un QR.
      }
    );

    camaraActiva = true;

    estadoCamara.innerText = "🟢 LISTO PARA ESCANEAR";
    estadoCamara.style.color = "#00ed45";

  } catch(error) {

    console.error("ERROR CÁMARA:", error);

    camaraActiva = false;
    estadoCamara.innerText = "🔴 NO SE PUDO ACCEDER A LA CÁMARA";
    estadoCamara.style.color = "#ff3030";

    mostrarError("NO SE PUDO ACCEDER A LA CÁMARA. REVISÁ LOS PERMISOS DEL NAVEGADOR.");

    procesando = false;
  }
}

async function detenerCamara() {

  if (!scanner) return;

  try {
    if (camaraActiva) {
      await scanner.stop();
    }
    scanner.clear();
  } catch(e) {
    console.log("Error deteniendo cámara:", e);
  }

  scanner = null;
  camaraActiva = false;

  estadoCamara.innerText = "⚪ CÁMARA DETENIDA";
  estadoCamara.style.color = "#aaa";
}

/* =====================================================
   PROCESAR QR
===================================================== */

function procesarQR(textoQR) {

  let id = String(textoQR).trim();

  console.log("QR ORIGINAL:", id);

  try {

    if (id.startsWith("http://") || id.startsWith("https://")) {

      const url = new URL(id);
      const parametro = url.searchParams.get("id");

      if (parametro) {
        id = parametro;
      }
    }

  } catch(error) {
    console.log("El QR no contiene una URL:", error);
  }

  id = id.trim().toUpperCase();

  console.log("ID FINAL DETECTADO:", id);

  if (!id) {
    mostrarError("NO SE PUDO OBTENER EL ID DEL QR");
    procesando = false;
    return;
  }

  consultarSocio(id);
}

/* =====================================================
   CONSULTAR SOCIO - JSONP
===================================================== */

function consultarSocio(id) {

  if (!id) {
    mostrarError("INGRESÁ UN ID DE SOCIO");
    procesando = false;
    return;
  }

  console.log("CONSULTANDO SOCIO:", id);

  mostrarCargando();

  const callbackName = "borosCallback_" + Date.now();

  let terminado = false;

  function limpiar() {
    if (terminado) return;
    terminado = true;

    clearTimeout(timeout);

    try {
      delete window[callbackName];
    } catch(e) {}
  }

  window[callbackName] = function(respuesta) {

    console.log("✅ RESPUESTA APPS SCRIPT:", respuesta);

    limpiar();

    try {
      mostrarResultado(respuesta);
    } catch(error) {

      console.error("ERROR PROCESANDO RESPUESTA:", error);

      mostrarError("ERROR PROCESANDO LA RESPUESTA");
      procesando = false;
    }
  };

  const script = document.createElement("script");

  const url =
    API_URL +
    "?api=1" +
    "&id=" + encodeURIComponent(id) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  script.src = url;
  script.async = true;

  console.log("URL APPS SCRIPT:", url);

  script.onerror = function() {

    console.error("❌ ERROR CARGANDO APPS SCRIPT:", url);

    limpiar();

    mostrarError("NO SE PUDO CONECTAR CON APPS SCRIPT");
    procesando = false;
  };

  const timeout = setTimeout(function() {

    if (terminado) return;

    console.error("❌ APPS SCRIPT NO RESPONDIÓ");

    limpiar();

    mostrarError("APPS SCRIPT NO RESPONDIÓ");
    procesando = false;

  }, 15000);

  document.body.appendChild(script);
}

/* =====================================================
   CARGANDO
===================================================== */

function mostrarCargando() {

  resultado.innerHTML =
    '<div class="socio-card">' +
      '<div class="acceso">' +
        '🔍<br><br>' +
        'VERIFICANDO SOCIO...' +
        '<small>Consultando membresía</small>' +
      '</div>' +
    '</div>';
}

/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(respuesta) {

  if (!respuesta) {
    mostrarError("NO SE RECIBIÓ RESPUESTA");
    procesando = false;
    return;
  }

  console.log("RESULTADO:", respuesta);

  if (!respuesta.encontrado) {

    entradasHoy++;
    denegadas++;

    actualizarEstadisticas();

    mostrarError(respuesta.mensaje || "SOCIO NO ENCONTRADO");

    finalizarConsulta();
    return;
  }

  entradasHoy++;

  const permitido = Boolean(respuesta.permitido);

  if (permitido) {
    permitidas++;
  } else {
    denegadas++;
  }

  actualizarEstadisticas();

  let fotoHTML = "";

  if (respuesta.foto && respuesta.foto.datos) {

    const tipo = respuesta.foto.tipo || "image/jpeg";

    fotoHTML =
      '<div class="foto-container">' +
        '<img class="foto" src="data:' +
        tipo + ';base64,' +
        respuesta.foto.datos +
        '" alt="Foto del socio">' +
      '</div>';
  }

  const claseEstado = permitido ? "permitido" : "denegado";
  const icono = permitido ? "🟢" : "🔴";
  const texto = permitido ? "ACCESO PERMITIDO" : "ACCESO DENEGADO";
  const mensaje = permitido
    ? "Entrada registrada correctamente"
    : "Membresía vencida";

  resultado.innerHTML =
    '<div class="socio-card">' +
      '<div class="socio-contenido">' +

        fotoHTML +

        '<div class="datos">' +

          '<div class="nombre">' +
            escaparHTML(respuesta.nombre || "") +
            " " +
            escaparHTML(respuesta.apellido || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>ID SOCIO</span>' +
            escaparHTML(respuesta.id || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>PLAN</span>' +
            escaparHTML(respuesta.plan || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>VENCIMIENTO</span>' +
            escaparHTML(respuesta.vencimiento || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>DNI</span>' +
            escaparHTML(respuesta.dni || "") +
          '</div>' +

        '</div>' +

      '</div>' +

      '<div class="acceso ' + claseEstado + '">' +
        icono + " " + texto +
        '<small>' + mensaje + '</small>' +
      '</div>' +

    '</div>';

  setTimeout(finalizarConsulta, 5000);
}

/* =====================================================
   UTILIDADES
===================================================== */

function escaparHTML(valor) {

  return String(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function mostrarError(mensaje) {

  resultado.innerHTML =
    '<div class="error">' +
      '🔴<br><br>' +
      escaparHTML(mensaje) +
    '</div>';
}

async function finalizarConsulta() {

  procesando = false;
  idManual.value = "";

  estadoCamara.innerText = "🟢 LISTO PARA ESCANEAR";
  estadoCamara.style.color = "#00ed45";

  if (!camaraActiva) {
    return;
  }
}

function actualizarEstadisticas() {

  document.getElementById("entradasHoy").innerText = entradasHoy;
  document.getElementById("permitidas").innerText = permitidas;
  document.getElementById("denegadas").innerText = denegadas;
}

/* =====================================================
   BÚSQUEDA MANUAL
===================================================== */

function buscarManual() {

  const id = idManual.value.trim().toUpperCase();

  if (!id) {
    mostrarError("INGRESÁ EL ID DEL SOCIO");
    return;
  }

  if (procesando) return;

  procesando = true;

  consultarSocio(id);
}

/* =====================================================
   BOTONES
===================================================== */

document.getElementById("abrirCamara")
  .addEventListener("click", iniciarCamara);

document.getElementById("detenerCamara")
  .addEventListener("click", detenerCamara);

document.getElementById("buscarManual")
  .addEventListener("click", buscarManual);

idManual.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    buscarManual();
  }

});

/*
  IMPORTANTE:
  NO abrimos la cámara automáticamente al cargar.
  En celulares debe abrirse al tocar el botón.
