<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boros Gym - Control de Acceso</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.contenedor{width:100%;max-width:1100px;margin:auto;padding:25px 20px 40px}
/* ===== LOGO BOROS ===== */

.logo {
    text-align: center;
    margin-bottom: 20px;
    padding-top: 10px;
    position: relative;
}

.logo-principal {
    font-size: clamp(65px, 11vw, 120px);
    font-weight: 1000;
    font-style: normal;
    letter-spacing: 8px;
    line-height: 0.9;
    color: #ff1515;

    text-shadow:
        0 0 5px rgba(255, 0, 0, 0.8),
        0 0 15px rgba(255, 0, 0, 0.45),
        0 0 35px rgba(255, 0, 0, 0.2);
}

.logo-sub {
    margin-top: 12px;
    color: #ff2020;
    font-size: clamp(18px, 3vw, 30px);
    font-weight: 1000;
    letter-spacing: 8px;
    text-transform: uppercase;
}

.logo-frase {
    margin-top: 12px;
    color: #ff2020;
    font-size: clamp(12px, 2vw, 18px);
    font-weight: 900;
    letter-spacing: 4px;
}

/* ===== LOGO BOROS ===== */

.logo {
    text-align: center;
    margin: 0 auto 20px;
    padding-top: 5px;
    position: relative;
}

.logo img {
    display: block;
    width: min(100%, 750px);
    height: auto;
    margin: 0 auto;
    object-fit: contain;
}

 .logo-icono {
    font-size: clamp(55px, 9vw, 100px);
    line-height: 1;
    margin-bottom: 5px;
    filter: grayscale(1) brightness(0.9);
}
    .logo-icono img {
    width: min(90%, 700px);
    max-height: 300px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
}
.titulo {
    text-align: center;
    font-size: clamp(32px, 6vw, 58px);
    font-weight: 900;
    margin: 20px 0 30px;
    letter-spacing: 2px;
}
.scanner-card{width:100%;border:4px solid #ff2020;border-radius:35px;padding:25px;background:#080808;box-shadow:0 0 30px rgba(255,0,0,.25)}
.scanner-titulo{text-align:center;font-size:clamp(28px,5vw,48px);font-weight:900;margin-bottom:25px}
#reader{width:100%;max-width:850px;margin:auto;border-radius:25px;overflow:hidden;background:#111}
#reader img{max-width:100%}
#reader video{width:100%!important;height:auto!important;border-radius:20px}
.estado{text-align:center;margin-top:25px;font-size:clamp(24px,5vw,42px);font-weight:900;color:#00ed45}
.ayuda{text-align:center;margin-top:10px;color:#bbb;font-size:clamp(16px,3vw,24px)}
.controles{margin-top:25px;display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.boton{border:none;border-radius:18px;padding:18px 28px;font-size:22px;font-weight:900;cursor:pointer;color:#fff;background:#ed1c24}
.boton:hover{background:#ff3030}
.boton.secundario{background:#222;border:2px solid #555}
.manual{margin-top:30px;padding-top:25px;border-top:2px solid #333}
.manual-titulo{text-align:center;font-size:clamp(20px,4vw,30px);margin-bottom:15px;color:#ddd}
.manual-contenedor{display:flex;gap:12px}
#idManual{flex:1;min-width:0;background:#111;color:#fff;border:2px solid #555;border-radius:15px;padding:18px;font-size:22px;text-transform:uppercase}
#buscarManual{background:#ed1c24;color:#fff;border:none;border-radius:15px;padding:0 28px;font-size:20px;font-weight:900}
#resultado{margin-top:25px}
.socio-card{background:#101010;border:3px solid #333;border-radius:30px;padding:25px}
.socio-contenido{display:flex;align-items:center;gap:30px}
.foto-container{width:300px;flex-shrink:0}
.foto{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:22px;border:4px solid #e51b23}
.datos{flex:1}
.nombre{font-size:clamp(28px,5vw,45px);font-weight:900;margin-bottom:20px}
.dato{padding:12px 0;border-bottom:1px solid #333;font-size:clamp(18px,3vw,25px)}
.dato span{display:block;color:#888;font-size:13px;font-weight:bold;letter-spacing:2px;margin-bottom:5px}
.acceso{margin-top:25px;padding:25px;border-radius:20px;text-align:center;font-size:clamp(28px,6vw,45px);font-weight:900}
.acceso small{display:block;margin-top:10px;color:#bbb;font-size:18px;font-weight:normal}
.permitido{color:#00ed45;border:3px solid #00a832;background:rgba(0,180,60,.10)}
.denegado{color:#ff3030;border:3px solid #b00000;background:rgba(180,0,0,.10)}
.error{background:#150000;border:3px solid #d00000;border-radius:25px;padding:30px 20px;text-align:center;color:#ff4040;font-size:clamp(20px,4vw,32px);font-weight:900}
.estadisticas{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:25px}
.estadistica{background:#101010;border:2px solid #333;border-radius:20px;padding:20px 10px;text-align:center;color:#999;font-size:15px;font-weight:bold}
.numero{display:block;margin-top:8px;color:#fff;font-size:38px;font-weight:900}
.verde{color:#00ed45}.rojo{color:#ff3030}
.footer{text-align:center;margin-top:30px;color:#777;font-size:15px;letter-spacing:3px}
@media(max-width:650px){
 .contenedor{padding:18px 10px 30px}
 .scanner-card{padding:12px;border-radius:25px}
 .scanner-titulo{margin-bottom:15px}
 #reader{border-radius:18px}
 .socio-contenido{flex-direction:column}
 .foto-container{width:85%;max-width:330px}
 .datos{width:100%;text-align:center}
 .dato{text-align:left}
 .manual-contenedor{flex-direction:column}
 #buscarManual{min-height:60px}
 .estadisticas{gap:7px}
 .estadistica{padding:15px 5px;font-size:11px}
 .numero{font-size:30px}
}
</style>
</head>

<body>
<div class="contenedor">

<!-- LOGO BOROS -->
<div class="logo">
    <img src="logo-boros.png" alt="BOROS Fitness Gym">
</div>

<div class="titulo">CONTROL DE ACCESO</div>

<div class="scanner-card">
  <div class="scanner-titulo">📷 ESCÁNER QR</div>

  <div id="reader"></div>

  <div id="estadoCamara" class="estado">⚪ TOCÁ «ABRIR CÁMARA»</div>

  <div class="ayuda">Presentá el QR del socio frente a la cámara</div>

  <div class="controles">
    <button class="boton" id="abrirCamara">📷 ABRIR CÁMARA</button>
    <button class="boton secundario" id="detenerCamara">⏹️ DETENER</button>
  </div>

  <div class="manual">
    <div class="manual-titulo">Si el QR no funciona, ingresá el ID del socio manualmente</div>

    <div class="manual-contenedor">
      <input id="idManual" type="text" placeholder="Ejemplo: B001" autocomplete="off">
      <button id="buscarManual">🔎 BUSCAR</button>
    </div>
  </div>
</div>

<div id="resultado"></div>

<div class="estadisticas">
  <div class="estadistica">ENTRADAS HOY<span id="entradasHoy" class="numero">0</span></div>
  <div class="estadistica">PERMITIDAS<span id="permitidas" class="numero verde">0</span></div>
  <div class="estadistica">DENEGADAS<span id="denegadas" class="numero rojo">0</span></div>
</div>

<div class="footer">BOROS • FUERZA • DISCIPLINA • RESULTADOS</div>

</div>

<script>
/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwVF61K5oldfMH1murcWrLTKjzrR78MwmBHPb4mA6kv3X2SjEKwXrRSfwSxkid7IrD_/exec";

/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;
let camaraActiva = false;
let procesando = false;

let entradasHoy = 0;
let permitidas = 0;
let denegadas = 0;

/* =====================================================
   ELEMENTOS
===================================================== */

const estadoCamara = document.getElementById("estadoCamara");
const resultado = document.getElementById("resultado");
const idManual = document.getElementById("idManual");

/* =====================================================
   CÁMARA
===================================================== */

async function iniciarCamara() {

  if (camaraActiva) return;

  estadoCamara.innerText = "🟡 SOLICITANDO CÁMARA...";
  estadoCamara.style.color = "#ffd000";

  try {

    if (scanner) {
      try { await scanner.stop(); } catch(e) {}
      try { scanner.clear(); } catch(e) {}
      scanner = null;
    }

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: function(width,height) {
          const size = Math.floor(Math.min(width,height) * 0.75);
          return {width:size,height:size};
        },
        aspectRatio: 1.0
      },
      function(decodedText) {

        if (procesando) return;

        procesando = true;

        console.log("📷 QR DETECTADO:", decodedText);

        estadoCamara.innerText = "🟡 QR DETECTADO — VERIFICANDO...";
        estadoCamara.style.color = "#ffd000";

        procesarQR(decodedText);
      },
      function(errorMessage) {
        // Normal: el lector busca un QR.
      }
    );

    camaraActiva = true;

    estadoCamara.innerText = "🟢 LISTO PARA ESCANEAR";
    estadoCamara.style.color = "#00ed45";

  } catch(error) {

    console.error("ERROR CÁMARA:", error);

    camaraActiva = false;
    estadoCamara.innerText = "🔴 NO SE PUDO ACCEDER A LA CÁMARA";
    estadoCamara.style.color = "#ff3030";

    mostrarError("NO SE PUDO ACCEDER A LA CÁMARA. REVISÁ LOS PERMISOS DEL NAVEGADOR.");

    procesando = false;
  }
}

async function detenerCamara() {

  if (!scanner) return;

  try {
    if (camaraActiva) {
      await scanner.stop();
    }
    scanner.clear();
  } catch(e) {
    console.log("Error deteniendo cámara:", e);
  }

  scanner = null;
  camaraActiva = false;

  estadoCamara.innerText = "⚪ CÁMARA DETENIDA";
  estadoCamara.style.color = "#aaa";
}

/* =====================================================
   PROCESAR QR
===================================================== */

function procesarQR(textoQR) {

  let id = String(textoQR).trim();

  console.log("QR ORIGINAL:", id);

  try {

    if (id.startsWith("http://") || id.startsWith("https://")) {

      const url = new URL(id);
      const parametro = url.searchParams.get("id");

      if (parametro) {
        id = parametro;
      }
    }

  } catch(error) {
    console.log("El QR no contiene una URL:", error);
  }

  id = id.trim().toUpperCase();

  console.log("ID FINAL DETECTADO:", id);

  if (!id) {
    mostrarError("NO SE PUDO OBTENER EL ID DEL QR");
    procesando = false;
    return;
  }

  consultarSocio(id);
}

/* =====================================================
   CONSULTAR SOCIO - JSONP
===================================================== */

function consultarSocio(id) {

  if (!id) {
    mostrarError("INGRESÁ UN ID DE SOCIO");
    procesando = false;
    return;
  }

  console.log("CONSULTANDO SOCIO:", id);

  mostrarCargando();

  const callbackName = "borosCallback_" + Date.now();

  let terminado = false;

  function limpiar() {
    if (terminado) return;
    terminado = true;

    clearTimeout(timeout);

    try {
      delete window[callbackName];
    } catch(e) {}
  }

  window[callbackName] = function(respuesta) {

    console.log("✅ RESPUESTA APPS SCRIPT:", respuesta);

    limpiar();

    try {
      mostrarResultado(respuesta);
    } catch(error) {

      console.error("ERROR PROCESANDO RESPUESTA:", error);

      mostrarError("ERROR PROCESANDO LA RESPUESTA");
      procesando = false;
    }
  };

  const script = document.createElement("script");

  const url =
    API_URL +
    "?api=1" +
    "&id=" + encodeURIComponent(id) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  script.src = url;
  script.async = true;

  console.log("URL APPS SCRIPT:", url);

  script.onerror = function() {

    console.error("❌ ERROR CARGANDO APPS SCRIPT:", url);

    limpiar();

    mostrarError("NO SE PUDO CONECTAR CON APPS SCRIPT");
    procesando = false;
  };

  const timeout = setTimeout(function() {

    if (terminado) return;

    console.error("❌ APPS SCRIPT NO RESPONDIÓ");

    limpiar();

    mostrarError("APPS SCRIPT NO RESPONDIÓ");
    procesando = false;

  }, 15000);

  document.body.appendChild(script);
}

/* =====================================================
   CARGANDO
===================================================== */

function mostrarCargando() {

  resultado.innerHTML =
    '<div class="socio-card">' +
      '<div class="acceso">' +
        '🔍<br><br>' +
        'VERIFICANDO SOCIO...' +
        '<small>Consultando membresía</small>' +
      '</div>' +
    '</div>';
}

/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(respuesta) {

  if (!respuesta) {
    mostrarError("NO SE RECIBIÓ RESPUESTA");
    procesando = false;
    return;
  }

  console.log("RESULTADO:", respuesta);

  if (!respuesta.encontrado) {

    entradasHoy++;
    denegadas++;

    actualizarEstadisticas();

    mostrarError(respuesta.mensaje || "SOCIO NO ENCONTRADO");

    finalizarConsulta();
    return;
  }

  entradasHoy++;

  const permitido = Boolean(respuesta.permitido);

  if (permitido) {
    permitidas++;
  } else {
    denegadas++;
  }

  actualizarEstadisticas();

  let fotoHTML = "";

  if (respuesta.foto && respuesta.foto.datos) {

    const tipo = respuesta.foto.tipo || "image/jpeg";

    fotoHTML =
      '<div class="foto-container">' +
        '<img class="foto" src="data:' +
        tipo + ';base64,' +
        respuesta.foto.datos +
        '" alt="Foto del socio">' +
      '</div>';
  }

  const claseEstado = permitido ? "permitido" : "denegado";
  const icono = permitido ? "🟢" : "🔴";
  const texto = permitido ? "ACCESO PERMITIDO" : "ACCESO DENEGADO";
  const mensaje = permitido
    ? "Entrada registrada correctamente"
    : "Membresía vencida";

  resultado.innerHTML =
    '<div class="socio-card">' +
      '<div class="socio-contenido">' +

        fotoHTML +

        '<div class="datos">' +

          '<div class="nombre">' +
            escaparHTML(respuesta.nombre || "") +
            " " +
            escaparHTML(respuesta.apellido || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>ID SOCIO</span>' +
            escaparHTML(respuesta.id || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>PLAN</span>' +
            escaparHTML(respuesta.plan || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>VENCIMIENTO</span>' +
            escaparHTML(respuesta.vencimiento || "") +
          '</div>' +

          '<div class="dato">' +
            '<span>DNI</span>' +
            escaparHTML(respuesta.dni || "") +
          '</div>' +

        '</div>' +

      '</div>' +

      '<div class="acceso ' + claseEstado + '">' +
        icono + " " + texto +
        '<small>' + mensaje + '</small>' +
      '</div>' +

    '</div>';

  setTimeout(finalizarConsulta, 5000);
}

/* =====================================================
   UTILIDADES
===================================================== */

function escaparHTML(valor) {

  return String(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function mostrarError(mensaje) {

  resultado.innerHTML =
    '<div class="error">' +
      '🔴<br><br>' +
      escaparHTML(mensaje) +
    '</div>';
}

async function finalizarConsulta() {

  procesando = false;
  idManual.value = "";

  estadoCamara.innerText = "🟢 LISTO PARA ESCANEAR";
  estadoCamara.style.color = "#00ed45";

  if (!camaraActiva) {
    return;
  }
}

function actualizarEstadisticas() {

  document.getElementById("entradasHoy").innerText = entradasHoy;
  document.getElementById("permitidas").innerText = permitidas;
  document.getElementById("denegadas").innerText = denegadas;
}

/* =====================================================
   BÚSQUEDA MANUAL
===================================================== */

function buscarManual() {

  const id = idManual.value.trim().toUpperCase();

  if (!id) {
    mostrarError("INGRESÁ EL ID DEL SOCIO");
    return;
  }

  if (procesando) return;

  procesando = true;

  consultarSocio(id);
}

/* =====================================================
   BOTONES
===================================================== */

document.getElementById("abrirCamara")
  .addEventListener("click", iniciarCamara);

document.getElementById("detenerCamara")
  .addEventListener("click", detenerCamara);

document.getElementById("buscarManual")
  .addEventListener("click", buscarManual);

idManual.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    buscarManual();
  }

});

/*
  IMPORTANTE:
  NO abrimos la cámara automáticamente al cargar.
  En celulares debe abrirse al tocar el botón.
*/

window.addEventListener("load", function() {

  estadoCamara.innerText = "⚪ TOCÁ «ABRIR CÁMARA»";
  estadoCamara.style.color = "#aaa";

});
</script>

</body>
</html>
