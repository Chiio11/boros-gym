<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Boros Gym - Control de Acceso</title>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  background: #050505;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;

  padding: 20px;

}


.contenedor {

  width: 100%;

  max-width: 1100px;

  margin: auto;

}


/* =========================
   LOGO
========================= */

.logo {

  text-align: center;

  margin-bottom: 25px;

}


.logo h2 {

  font-size:
    clamp(55px, 10vw, 100px);

  font-weight: 900;

  font-style: italic;

  letter-spacing: 8px;

  text-shadow:
    4px 4px 0 #b00000;

}


.logo p {

  color: #ff7777;

  font-size:
    clamp(15px, 3vw, 28px);

  font-weight: bold;

  letter-spacing: 8px;

}


/* =========================
   TITULO
========================= */

h1 {

  text-align: center;

  font-size:
    clamp(30px, 6vw, 60px);

  margin: 35px 0;

  font-weight: 900;

}


/* =========================
   ESCANER
========================= */

.scanner {

  border: 4px solid #ff2525;

  border-radius: 35px;

  padding: 25px;

  background: #090909;

  box-shadow:
    0 0 30px
    rgba(255,0,0,.25);

}


.titulo-scanner {

  text-align: center;

  font-size:
    clamp(28px, 5vw, 45px);

  font-weight: 900;

  margin-bottom: 25px;

}


#reader {

  width: 100%;

  max-width: 800px;

  margin: auto;

  overflow: hidden;

  border-radius: 25px;

  background: #000;

}


#reader video {

  width: 100% !important;

  height: auto !important;

}


#reader button {

  background: #e60000 !important;

  color: white !important;

  border: none !important;

  border-radius: 12px !important;

  padding: 14px 20px !important;

  font-size: 18px !important;

  font-weight: bold !important;

}


.estado {

  text-align: center;

  margin-top: 25px;

  font-size:
    clamp(24px, 5vw, 42px);

  font-weight: 900;

}


.verde {

  color: #24ff43;

}


.rojo {

  color: #ff3333;

}


.subestado {

  text-align: center;

  margin-top: 10px;

  color: #aaa;

  font-size:
    clamp(15px, 3vw, 22px);

}


/* =========================
   RESULTADO
========================= */

.resultado {

  display: none;

  margin-top: 25px;

  padding: 30px;

  border: 3px solid #333;

  border-radius: 30px;

  background: #101010;

}


.socio {

  display: flex;

  gap: 30px;

  align-items: center;

}


.foto {

  width: 250px;

  height: 300px;

  object-fit: cover;

  border-radius: 20px;

  background: #222;

}


.nombre {

  font-size:
    clamp(28px, 5vw, 50px);

  font-weight: 900;

  margin-bottom: 20px;

}


.dato {

  font-size:
    clamp(18px, 3vw, 27px);

  margin: 12px 0;

}


.dato strong {

  color: #ff3b3b;

}


.acceso {

  margin-top: 25px;

  padding: 25px;

  border-radius: 20px;

  text-align: center;

  font-size:
    clamp(28px, 5vw, 50px);

  font-weight: 900;

}


.acceso-ok {

  color: #21ff43;

  border: 3px solid #21ff43;

  background:
    rgba(0,255,50,.06);

}


.acceso-no {

  color: #ff3030;

  border: 3px solid #ff3030;

  background:
    rgba(255,0,0,.06);

}


/* =========================
   ESTADISTICAS
========================= */

.estadisticas {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 20px;

  margin-top: 25px;

}


.estadistica {

  text-align: center;

  padding: 25px;

  border: 2px solid #333;

  border-radius: 20px;

  background: #0e0e0e;

}


.numero {

  font-size:
    clamp(40px, 7vw, 65px);

  font-weight: 900;

}


.etiqueta {

  color: #aaa;

  font-weight: bold;

}


#permitidas {

  color: #20ff43;

}


#denegadas {

  color: #ff3030;

}


/* =========================
   BOTON
========================= */

#nuevo {

  display: none;

  width: 100%;

  margin-top: 20px;

  padding: 20px;

  border: none;

  border-radius: 15px;

  background: #e60000;

  color: white;

  font-size: 22px;

  font-weight: 900;

}


/* =========================
   FOOTER
========================= */

.footer {

  text-align: center;

  margin-top: 35px;

  color: #aaa;

  letter-spacing: 4px;

}


.footer span {

  color: red;

}


/* =========================
   CELULAR
========================= */

@media(max-width:700px) {

  body {

    padding: 10px;

  }


  .scanner {

    padding: 15px;

    border-radius: 25px;

  }


  .socio {

    flex-direction: column;

    text-align: center;

  }


  .foto {

    width: 75vw;

    max-width: 300px;

    height: 350px;

  }


  .estadisticas {

    grid-template-columns: 1fr;

  }

}

</style>

</head>


<body>


<div class="contenedor">


  <div class="logo">

    <h2>BOROS</h2>

    <p>STRENGTH & FITNESS</p>

  </div>


  <h1>
    CONTROL DE ACCESO
  </h1>


  <div class="scanner">


    <div class="titulo-scanner">
      📷 ESCÁNER QR
    </div>


    <div id="reader"></div>


    <div
      id="estado"
      class="estado verde"
    >
      🟢 INICIANDO CÁMARA...
    </div>


    <div
      id="subestado"
      class="subestado"
    >
      Preparando lector...
    </div>


    <button
      id="nuevo"
      onclick="reiniciarScanner()"
    >
      📷 ESCANEAR OTRO SOCIO
    </button>


  </div>


  <div
    id="resultado"
    class="resultado"
  >


    <div class="socio">


      <img
        id="foto"
        class="foto"
        alt="Foto del socio"
      >


      <div>


        <div
          id="nombre"
          class="nombre"
        ></div>


        <div class="dato">
          <strong>ID:</strong>
          <span id="id"></span>
        </div>


        <div class="dato">
          <strong>DNI:</strong>
          <span id="dni"></span>
        </div>


        <div class="dato">
          <strong>PLAN:</strong>
          <span id="plan"></span>
        </div>


        <div class="dato">
          <strong>VENCIMIENTO:</strong>
          <span id="vencimiento"></span>
        </div>


        <div class="dato">
          <strong>ESTADO:</strong>
          <span id="estadoSocio"></span>
        </div>


      </div>

    </div>


    <div
      id="acceso"
      class="acceso"
    ></div>


  </div>


  <div class="estadisticas">


    <div class="estadistica">

      <div
        id="entradas"
        class="numero"
      >
        0
      </div>

      <div class="etiqueta">
        ENTRADAS HOY
      </div>

    </div>


    <div class="estadistica">

      <div
        id="permitidas"
        class="numero"
      >
        0
      </div>

      <div class="etiqueta">
        PERMITIDAS
      </div>

    </div>


    <div class="estadistica">

      <div
        id="denegadas"
        class="numero"
      >
        0
      </div>

      <div class="etiqueta">
        DENEGADAS
      </div>

    </div>


  </div>


  <div class="footer">

    BOROS

    <span>•</span>

    FUERZA

    <span>•</span>

    DISCIPLINA

    <span>•</span>

    RESULTADOS

  </div>


</div>



<script>


/* =====================================================
   URL DE TU APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwWuTDND-A06UgrvhlZ5Uifo3YsiiuRHbVlPFAGXykmaVQR5h6IuPpehLCLP7KiJYXC/exec";


/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let procesando = false;

let entradas = 0;

let permitidas = 0;

let denegadas = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const estado =
  document.getElementById("estado");

const subestado =
  document.getElementById("subestado");

const resultado =
  document.getElementById("resultado");

const nuevo =
  document.getElementById("nuevo");


/* =====================================================
   INICIAR
===================================================== */

window.onload =
  function() {

    iniciarScanner();

  };


/* =====================================================
   CÁMARA
===================================================== */

function iniciarScanner() {


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox:
        function(
          ancho,
          alto
        ) {

          const tamaño =
            Math.min(
              ancho * 0.75,
              alto * 0.75,
              450
            );

          return {

            width: tamaño,

            height: tamaño

          };

        }

    },

    function(texto) {

      if (procesando) {
        return;
      }


      procesando = true;


      consultarQR(texto);

    },

    function() {

      /*
       * No mostramos errores
       * mientras busca el QR.
       */

    }

  )

  .then(function() {

    estado.innerHTML =
      "🟢 LISTO PARA ESCANEAR";

    subestado.innerHTML =
      "Presentá el QR del socio frente a la cámara.";

  })

  .catch(function(error) {

    console.error(error);


    estado.innerHTML =
      "🔴 NO SE PUDO ACCEDER A LA CÁMARA";

    estado.className =
      "estado rojo";


    subestado.innerHTML =
      "Permití el uso de la cámara en el navegador.";

  });

}


/* =====================================================
   PROCESAR QR
===================================================== */

function consultarQR(textoQR) {


  let id =
    String(textoQR)
      .trim();


  /*
   * Si el QR contiene una URL
   * con ?id=B001, extraemos B001.
   */

  try {

    const url =
      new URL(textoQR);


    const parametro =
      url.searchParams.get("id");


    if (parametro) {

      id =
        parametro.trim();

    }

  } catch(error) {

    /*
     * Si no es una URL,
     * usamos directamente el texto.
     */

  }


  estado.innerHTML =
    "🟡 QR DETECTADO";

  estado.className =
    "estado";


  subestado.innerHTML =
    "Consultando socio...";


  llamarAPI(id);

}


/* =====================================================
   LLAMAR APPS SCRIPT
===================================================== */

function llamarAPI(id) {


  /*
   * Creamos un nombre único
   * para la función JSONP.
   */

  const callbackName =
    "borosCallback_" +
    Date.now();


  window[callbackName] =
    function(respuesta) {


      console.log(
        "Respuesta Boros:",
        respuesta
      );


      try {

        mostrarResultado(
          respuesta
        );

      } finally {

        delete window[
          callbackName
        ];

      }

    };


  const script =
    document.createElement(
      "script"
    );


  const url =
    API_URL +
    "?api=1" +
    "&id=" +
    encodeURIComponent(id) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src = url;


  script.onerror =
    function() {


      estado.innerHTML =
        "🔴 ERROR DE CONEXIÓN";


      estado.className =
        "estado rojo";


      subestado.innerHTML =
        "No se pudo comunicar con Apps Script.";


      procesando = false;

    };


  document.body.appendChild(
    script
  );


  /*
   * Si después de 10 segundos
   * no responde.
   */

  setTimeout(
    function() {

      if (
        window[
          callbackName
        ]
      ) {

        estado.innerHTML =
          "🔴 TIEMPO DE ESPERA AGOTADO";

        estado.className =
          "estado rojo";

        subestado.innerHTML =
          "Apps Script no respondió.";

        delete window[
          callbackName
        ];

        procesando = false;

      }

    },
    10000
  );

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  socio
) {


  if (
    !socio ||
    !socio.encontrado
  ) {


    estado.innerHTML =
      "🔴 SOCIO NO ENCONTRADO";

    estado.className =
      "estado rojo";


    subestado.innerHTML =
      socio &&
      socio.mensaje
        ? socio.mensaje
        : "Revisá el QR.";


    nuevo.style.display =
      "block";


    procesando = false;


    return;

  }


  resultado.style.display =
    "block";


  document.getElementById(
    "nombre"
  ).textContent =
    (
      socio.nombre || ""
    )
    +
    " "
    +
    (
      socio.apellido || ""
    );


  document.getElementById(
    "id"
  ).textContent =
    socio.id || "";


  document.getElementById(
    "dni"
  ).textContent =
    socio.dni || "";


  document.getElementById(
    "plan"
  ).textContent =
    socio.plan || "";


  document.getElementById(
    "vencimiento"
  ).textContent =
    socio.vencimiento || "";


  document.getElementById(
    "estadoSocio"
  ).textContent =
    socio.estado || "";


  /*
   * FOTO
   */

  const foto =
    document.getElementById(
      "foto"
    );


  if (
    socio.foto &&
    socio.foto.datos
  ) {

    foto.src =
      "data:" +
      socio.foto.tipo +
      ";base64," +
      socio.foto.datos;

    foto.style.display =
      "block";

  } else {

    foto.style.display =
      "none";

  }


  /*
   * ACCESO
   */

  const acceso =
    document.getElementById(
      "acceso"
    );


  if (socio.permitido) {


    acceso.className =
      "acceso acceso-ok";


    acceso.innerHTML =
      "🟢 ACCESO PERMITIDO";


    estado.innerHTML =
      "🟢 ACCESO PERMITIDO";

    estado.className =
      "estado verde";


    subestado.innerHTML =
      "Entrada registrada correctamente.";


    permitidas++;


  } else {


    acceso.className =
      "acceso acceso-no";


    acceso.innerHTML =
      "🔴 ACCESO DENEGADO";


    estado.innerHTML =
      "🔴 ACCESO DENEGADO";

    estado.className =
      "estado rojo";


    subestado.innerHTML =
      "La membresía no está vigente.";


    denegadas++;

  }


  entradas++;


  actualizarEstadisticas();


  nuevo.style.display =
    "block";


  /*
   * Detenemos el scanner
   * para que no registre
   * el mismo QR varias veces.
   */

  if (scanner) {

    scanner.pause(
      true
    );

  }

}


/* =====================================================
   REINICIAR
===================================================== */

function reiniciarScanner() {


  resultado.style.display =
    "none";


  nuevo.style.display =
    "none";


  estado.innerHTML =
    "🟢 LISTO PARA ESCANEAR";

  estado.className =
    "estado verde";


  subestado.innerHTML =
    "Presentá el QR del socio frente a la cámara.";


  procesando = false;


  if (scanner) {

    scanner.resume();

  }

}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

function actualizarEstadisticas() {


  document.getElementById(
    "entradas"
  ).textContent =
    entradas;


  document.getElementById(
    "permitidas"
  ).textContent =
    permitidas;


  document.getElementById(
    "denegadas"
  ).textContent =
    denegadas;

}

</script>


</body>

</html>
