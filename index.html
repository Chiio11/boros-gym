<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Boros Gym - Control de Acceso</title>

  <!-- Lector QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      background: #050505;
      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    body {
      min-height: 100vh;
    }


    /* =========================
       CONTENEDOR
    ========================= */

    .contenedor {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

      padding:
        25px
        15px
        50px;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {

      text-align: center;

      margin-bottom: 10px;
    }


    .logo-principal {

      font-size:
        clamp(
          55px,
          12vw,
          100px
        );

      font-weight: 900;

      font-style: italic;

      letter-spacing: 8px;

      line-height: 1;

      color: #e51b23;

      text-shadow:

        3px 3px 0 #650000,

        0 0 25px
        rgba(
          229,
          27,
          35,
          .35
        );
    }


    .logo-sub {

      margin-top: 12px;

      font-size:
        clamp(
          13px,
          3vw,
          21px
        );

      font-weight: bold;

      letter-spacing: 6px;

      color: white;
    }


    /* =========================
       TITULO
    ========================= */

    .titulo {

      text-align: center;

      margin:
        30px
        0
        20px;

      font-size:
        clamp(
          25px,
          5vw,
          38px
        );

      font-weight: 900;

      letter-spacing: 2px;
    }


    /* =========================
       ESCANER
    ========================= */

    .scanner-card {

      background: #101010;

      border:
        3px solid
        #e51b23;

      border-radius: 25px;

      padding: 20px;

      box-shadow:
        0 0 35px
        rgba(
          229,
          27,
          35,
          .20
        );
    }


    .scanner-titulo {

      text-align: center;

      font-size:
        clamp(
          23px,
          5vw,
          32px
        );

      font-weight: 900;

      margin-bottom: 20px;
    }


    #reader {

      width: 100%;

      max-width: 750px;

      margin: 0 auto;

      overflow: hidden;

      border-radius: 20px;
    }


    #reader video {

      width: 100% !important;

      border-radius: 20px;
    }


    #reader__scan_region {

      border-radius: 20px;
    }


    #reader__dashboard {

      padding-top: 15px;
    }


    #reader__dashboard button {

      background: #e51b23 !important;

      color: white !important;

      border: none !important;

      border-radius: 10px !important;

      padding: 12px 20px !important;

      font-weight: bold !important;
    }


    #reader__dashboard select {

      background: #222 !important;

      color: white !important;

      border: 1px solid #555 !important;

      border-radius: 8px !important;

      padding: 8px !important;
    }


    .estado-camara {

      text-align: center;

      margin-top: 20px;

      font-size:
        clamp(
          20px,
          5vw,
          30px
        );

      font-weight: 900;
    }


    .ayuda {

      text-align: center;

      color: #999;

      font-size: 15px;

      margin-top: 8px;
    }


    /* =========================
       RESULTADO
    ========================= */

    #resultado {

      margin-top: 25px;
    }


    .socio-card {

      background: #101010;

      border:
        2px solid
        #333;

      border-radius: 25px;

      padding: 25px;

      box-shadow:
        0 0 25px
        rgba(
          0,
          0,
          0,
          .5
        );
    }


    .socio-contenido {

      display: flex;

      align-items: center;

      gap: 30px;
    }


    /* =========================
       FOTO
    ========================= */

    .foto-container {

      width: 300px;

      flex-shrink: 0;
    }


    .foto {

      display: block;

      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      border-radius: 20px;

      border:
        4px solid
        #e51b23;

      background: #222;
    }


    /* =========================
       DATOS
    ========================= */

    .datos {

      flex: 1;
    }


    .nombre {

      font-size:
        clamp(
          28px,
          5vw,
          45px
        );

      font-weight: 900;

      line-height: 1.1;

      margin-bottom: 20px;
    }


    .dato {

      padding:
        13px
        0;

      border-bottom:
        1px solid
        #333;

      font-size:
        clamp(
          18px,
          3vw,
          25px
        );
    }


    .dato span {

      display: block;

      color: #888;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 2px;

      margin-bottom: 5px;
    }


    /* =========================
       ACCESO
    ========================= */

    .acceso {

      margin-top: 25px;

      padding: 25px 15px;

      border-radius: 20px;

      text-align: center;

      font-size:
        clamp(
          28px,
          6vw,
          45px
        );

      font-weight: 900;
    }


    .permitido {

      color: #00e640;

      border:
        3px solid
        #00a832;

      background:
        rgba(
          0,
          180,
          60,
          .10
        );

      box-shadow:
        0 0 25px
        rgba(
          0,
          230,
          64,
          .15
        );
    }


    .denegado {

      color: #ff3030;

      border:
        3px solid
        #b00000;

      background:
        rgba(
          180,
          0,
          0,
          .10
        );
    }


    .acceso small {

      display: block;

      margin-top: 10px;

      color: #bbb;

      font-size: 16px;

      font-weight: normal;
    }


    /* =========================
       ERROR
    ========================= */

    .error {

      background: #150000;

      border:
        3px solid
        #c00000;

      border-radius: 20px;

      padding: 35px 20px;

      text-align: center;

      color: #ff3030;

      font-size:
        clamp(
          20px,
          5vw,
          30px
        );

      font-weight: 900;
    }


    /* =========================
       CARGANDO
    ========================= */

    .cargando {

      background: #101010;

      border:
        2px solid
        #444;

      border-radius: 20px;

      padding: 35px;

      text-align: center;

      font-size: 28px;

      font-weight: 900;
    }


    /* =========================
       ESTADISTICAS
    ========================= */

    .estadisticas {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap: 15px;

      margin-top: 20px;
    }


    .estadistica {

      background: #101010;

      border:
        2px solid
        #333;

      border-radius: 18px;

      padding: 18px 10px;

      text-align: center;

      color: #888;

      font-size: 13px;

      font-weight: bold;

      letter-spacing: 1px;
    }


    .numero {

      display: block;

      margin-top: 6px;

      color: white;

      font-size: 35px;

      font-weight: 900;
    }


    .verde {

      color: #00e640;
    }


    .rojo {

      color: #e51b23;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      text-align: center;

      margin-top: 30px;

      color: #777;

      font-size: 14px;

      letter-spacing: 3px;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (
      max-width: 650px
    ) {


      .contenedor {

        padding:
          15px
          8px
          30px;
      }


      .logo-principal {

        font-size: 55px;

        letter-spacing: 5px;
      }


      .logo-sub {

        font-size: 12px;

        letter-spacing: 4px;
      }


      .titulo {

        margin:
          25px
          0
          15px;
      }


      .scanner-card {

        padding: 10px;

        border-radius: 20px;
      }


      .scanner-titulo {

        font-size: 22px;
      }


      .socio-card {

        padding: 15px;

        border-radius: 20px;
      }


      .socio-contenido {

        flex-direction: column;

        gap: 20px;
      }


      .foto-container {

        width: 85%;

        max-width: 350px;
      }


      .datos {

        width: 100%;

        text-align: center;
      }


      .nombre {

        font-size: 28px;
      }


      .dato {

        text-align: left;

        font-size: 18px;
      }


      .estadisticas {

        gap: 7px;
      }


      .estadistica {

        font-size: 10px;

        padding:
          14px
          4px;
      }


      .numero {

        font-size: 28px;
      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <!-- =========================
       LOGO
  ========================== -->

  <div class="logo">

    <div class="logo-principal">
      BOROS
    </div>

    <div class="logo-sub">
      STRENGTH & FITNESS
    </div>

  </div>


  <div class="titulo">
    CONTROL DE ACCESO
  </div>


  <!-- =========================
       ESCANER
  ========================== -->

  <div class="scanner-card">

    <div class="scanner-titulo">
      📷 ESCÁNER QR
    </div>


    <div id="reader"></div>


    <div
      id="estadoCamara"
      class="estado-camara">

      INICIANDO CÁMARA...

    </div>


    <div class="ayuda">

      Presentá el QR del socio
      frente a la cámara

    </div>

  </div>


  <!-- =========================
       RESULTADO
  ========================== -->

  <div id="resultado"></div>


  <!-- =========================
       ESTADISTICAS
  ========================== -->

  <div class="estadisticas">


    <div class="estadistica">

      ENTRADAS HOY

      <span
        id="entradasHoy"
        class="numero">

        0

      </span>

    </div>


    <div class="estadistica">

      PERMITIDAS

      <span
        id="permitidas"
        class="numero verde">

        0

      </span>

    </div>


    <div class="estadistica">

      DENEGADAS

      <span
        id="denegadas"
        class="numero rojo">

        0

      </span>

    </div>


  </div>


  <div class="footer">

    💪 BOROS • FUERZA • DISCIPLINA • RESULTADOS

  </div>


</div>



<script>


/* =====================================================
   URL DE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwWuTDND-A06UgrvhlZ5Uifo3YsiiuRHbVlPFAGXykmaVQR5h6IuPpehLCLP7KiJYXC/exec";


/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let procesando = false;

let entradasHoy = 0;

let permitidas = 0;

let denegadas = 0;



/* =====================================================
   INICIAR ESCANER
===================================================== */

function iniciarCamara() {


  const estado =
    document.getElementById(
      "estadoCamara"
    );


  estado.innerText =
    "SOLICITANDO CÁMARA...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },


    {

      fps: 10,


      qrbox:
        function(
          width,
          height
        ) {

          const tamaño =
            Math.min(
              width,
              height
            ) * 0.70;


          return {

            width: tamaño,

            height: tamaño

          };

        },


      aspectRatio: 1.0

    },


    function(decodedText) {

      if (procesando) {

        return;

      }


      procesando = true;


      procesarQR(
        decodedText
      );

    },


    function(errorMessage) {

      /*
        Estos errores son normales
        mientras busca un QR.
      */

    }

  )


  .then(function() {


    estado.innerText =
      "🟢 LISTO PARA ESCANEAR";


    estado.style.color =
      "#00e640";

  })


  .catch(function(error) {


    console.error(
      "ERROR CÁMARA:",
      error
    );


    estado.innerText =
      "🔴 NO SE PUDO ACCEDER A LA CÁMARA";


    estado.style.color =
      "#ff3030";


    mostrarError(
      "NO SE PUDO ACCEDER A LA CÁMARA"
    );


  });

}



/* =====================================================
   PROCESAR QR
===================================================== */

function procesarQR(
  textoQR
) {


  let id =
    String(
      textoQR
    ).trim();


  /*
    Si el QR contiene una URL como:

    https://chiio11.github.io/boros-gym/?id=B001

    extraemos solamente:

    B001
  */


  try {


    if (

      id.startsWith(
        "http://"
      )

      ||

      id.startsWith(
        "https://"
      )

    ) {


      const url =
        new URL(id);


      const parametro =
        url.searchParams.get(
          "id"
        );


      if (parametro) {

        id = parametro;

      }

    }


  }

  catch(error) {


    console.log(
      "El QR no es una URL."
    );

  }


  id =
    id
      .trim()
      .toUpperCase();


  console.log(
    "ID DETECTADO:",
    id
  );


  consultarSocio(
    id
  );

}



/* =====================================================
   CONSULTAR APPS SCRIPT
===================================================== */

function consultarSocio(
  id
) {


  mostrarCargando();


  /*
    Creamos un nombre único
    para la función de respuesta.
  */

  const callbackName =
    "borosCallback_" +
    Date.now();


  /*
    Apps Script llamará
    a esta función.
  */

  window[
    callbackName
  ] = function(resultado) {


    console.log(
      "RESPUESTA APPS SCRIPT:",
      resultado
    );


    try {


      mostrarResultado(
        resultado
      );


    }

    catch(error) {


      console.error(
        error
      );


      mostrarError(
        "ERROR PROCESANDO LOS DATOS"
      );


    }


    delete window[
      callbackName
    ];


    procesando = false;

  };


  /*
    Creamos el <script>
    para hacer JSONP.
  */

  const script =
    document.createElement(
      "script"
    );


  script.src =

    API_URL +

    "?api=1" +

    "&id=" +

    encodeURIComponent(
      id
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  script.async = true;


  script.onerror =
    function() {


      console.error(
        "ERROR CARGANDO APPS SCRIPT:",
        script.src
      );


      mostrarError(
        "NO SE PUDO CONECTAR CON EL SISTEMA"
      );


      delete window[
        callbackName
      ];


      procesando = false;

    };


  document.body.appendChild(
    script
  );

}



/* =====================================================
   MOSTRAR CARGANDO
===================================================== */

function mostrarCargando() {


  document.getElementById(
    "resultado"
  ).innerHTML =

    '<div class="cargando">' +

      '🔍<br><br>' +

      'VERIFICANDO SOCIO...' +

      '<small>' +

        '<br>Consultando membresía' +

      '</small>' +

    '</div>';

}



/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  resultado
) {


  if (!resultado) {


    mostrarError(
      "NO SE RECIBIÓ RESPUESTA DEL SISTEMA"
    );


    procesando = false;

    return;

  }


  console.log(
    "RESULTADO:",
    resultado
  );


  /*
    SOCIO NO ENCONTRADO
  */

  if (
    !resultado.encontrado
  ) {


    mostrarError(

      resultado.mensaje ||

      "SOCIO NO ENCONTRADO"

    );


    denegadas++;

    entradasHoy++;

    actualizarEstadisticas();


    volverAlEscaner();


    return;

  }


  /*
    Contabilizamos entrada
  */

  entradasHoy++;


  if (
    resultado.permitido
  ) {

    permitidas++;

  }

  else {

    denegadas++;

  }


  actualizarEstadisticas();



  /* =========================
     FOTO
  ========================== */

  let fotoHTML = "";


  if (

    resultado.foto &&

    resultado.foto.datos

  ) {


    fotoHTML =

      '<div class="foto-container">' +

        '<img ' +

          'class="foto" ' +

          'src="data:' +

            resultado.foto.tipo +

            ';base64,' +

            resultado.foto.datos +

          '" ' +

          'alt="Foto del socio">' +

      '</div>';

  }


  else {


    fotoHTML =

      '<div class="foto-container">' +

        '<div ' +

          'class="foto" ' +

          'style="' +

            'display:flex;' +

            'align-items:center;' +

            'justify-content:center;' +

            'font-size:70px;' +

            'color:#555;' +

          '"' +

        '>' +

          '👤' +

        '</div>' +

      '</div>';

  }



  /* =========================
     ESTADO
  ========================== */

  const claseEstado =

    resultado.permitido

      ? "permitido"

      : "denegado";


  const icono =

    resultado.permitido

      ? "🟢"

      : "🔴";


  const texto =

    resultado.permitido

      ? "ACCESO PERMITIDO"

      : "ACCESO DENEGADO";


  const mensaje =

    resultado.permitido

      ? "Entrada registrada correctamente"

      : "Membresía vencida";



  /* =========================
     MOSTRAR TARJETA
  ========================== */

  document.getElementById(
    "resultado"
  ).innerHTML =


    '<div class="socio-card">' +


      '<div class="socio-contenido">' +


        fotoHTML +


        '<div class="datos">' +


          '<div class="nombre">' +

            escaparHTML(
              resultado.nombre
            ) +

            ' ' +

            escaparHTML(
              resultado.apellido
            ) +

          '</div>' +



          '<div class="dato">' +

            '<span>ID SOCIO</span>' +

            escaparHTML(
              resultado.id
            ) +

          '</div>' +



          '<div class="dato">' +

            '<span>PLAN</span>' +

            escaparHTML(
              resultado.plan
            ) +

          '</div>' +



          '<div class="dato">' +

            '<span>VENCIMIENTO</span>' +

            escaparHTML(
              resultado.vencimiento
            ) +

          '</div>' +



          '<div class="dato">' +

            '<span>DNI</span>' +

            escaparHTML(
              resultado.dni
            ) +

          '</div>' +


        '</div>' +


      '</div>' +



      '<div class="acceso ' +

        claseEstado +

      '">' +

        icono +

        ' ' +

        texto +

        '<small>' +

          mensaje +

        '</small>' +

      '</div>' +


    '</div>';


  volverAlEscaner();

}



/* =====================================================
   MOSTRAR ERROR
===================================================== */

function mostrarError(
  mensaje
) {


  document.getElementById(
    "resultado"
  ).innerHTML =

    '<div class="error">' +

      '🔴<br><br>' +

      escaparHTML(
        mensaje
      ) +

    '</div>';

}



/* =====================================================
   VOLVER AL ESCANER
===================================================== */

function volverAlEscaner() {


  setTimeout(

    function() {


      document.getElementById(
        "resultado"
      ).innerHTML = "";


      procesando = false;


    },

    5000

  );

}



/* =====================================================
   ESTADISTICAS
===================================================== */

function actualizarEstadisticas() {


  document.getElementById(
    "entradasHoy"
  ).innerText =
    entradasHoy;


  document.getElementById(
    "permitidas"
  ).innerText =
    permitidas;


  document.getElementById(
    "denegadas"
  ).innerText =
    denegadas;

}



/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escaparHTML(
  texto
) {


  if (
    texto === null ||
    texto === undefined
  ) {

    return "";

  }


  return String(texto)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   ARRANCAR
===================================================== */

window.addEventListener(
  "load",
  function() {

    iniciarCamara();

  }
);


</script>


</body>

</html>
