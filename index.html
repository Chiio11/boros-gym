<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.contenedor {

    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    padding:
        25px
        25px
        50px
        25px;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    text-align: center;

    margin-bottom: 25px;

}

.logo-principal {

    font-size: 72px;

    font-weight: 900;

    letter-spacing: 8px;

    line-height: 1;

    font-style: italic;

    color: white;

    text-shadow:
        3px 3px 0 #e50914,
        0 0 20px rgba(255,0,0,.25);

}

.logo-sub {

    margin-top: 8px;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 8px;

    color: #ff6b72;

}


/* =====================================================
   TITULO
===================================================== */

.titulo {

    text-align: center;

    font-size: 38px;

    font-weight: 900;

    letter-spacing: 3px;

    margin:
        30px
        0
        25px
        0;

}


/* =====================================================
   CAJA PRINCIPAL
===================================================== */

.panel {

    width: 100%;

    border:
        3px solid
        #ff202a;

    border-radius: 30px;

    padding: 30px;

    background:
        linear-gradient(
            145deg,
            #111111,
            #050505
        );

    box-shadow:
        0 0 25px
        rgba(255,0,0,.25);

}


/* =====================================================
   TITULO ESCANER
===================================================== */

.titulo-escaner {

    text-align: center;

    font-size: 34px;

    font-weight: 900;

    margin-bottom: 25px;

}


/* =====================================================
   CAMARA
===================================================== */

.camara-container {

    width: 100%;

    max-width: 800px;

    margin:
        0 auto
        25px
        auto;

    position: relative;

    overflow: hidden;

    border-radius: 25px;

    background: #000;

    border:
        2px solid
        #222;

}


/*
   Video
*/

#video {

    display: block;

    width: 100%;

    height: auto;

    min-height: 300px;

    max-height: 600px;

    object-fit: cover;

    background: #000;

}


/*
   Marco del QR
*/

.marco-qr {

    position: absolute;

    width: 55%;

    aspect-ratio: 1 / 1;

    left: 22.5%;

    top: 15%;

    border:
        4px solid
        rgba(255,255,255,.9);

    border-radius: 10px;

    pointer-events: none;

}


/* =====================================================
   ESTADO
===================================================== */

.estado {

    text-align: center;

    margin:
        15px
        0
        25px;

}

.estado-principal {

    font-size: 32px;

    font-weight: 900;

}

.estado-sub {

    margin-top: 8px;

    font-size: 18px;

    color: #aaa;

}

.estado.ok .estado-principal {

    color: #22ff45;

}

.estado.error .estado-principal {

    color: #ff4141;

}

.estado.buscando .estado-principal {

    color: #ffd000;

}


/* =====================================================
   BOTONES
===================================================== */

.botones {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;

    margin-bottom: 30px;

}

button {

    border: none;

    border-radius: 16px;

    padding:
        18px
        30px;

    font-size: 20px;

    font-weight: 900;

    cursor: pointer;

    color: white;

    background: #ed1c24;

    box-shadow:
        0 5px 20px
        rgba(255,0,0,.25);

    transition: .2s;

}

button:hover {

    transform: scale(1.03);

}

button:active {

    transform: scale(.98);

}

.btn-detener {

    background: #242424;

    border:
        2px solid
        #555;

}


/* =====================================================
   BUSQUEDA MANUAL
===================================================== */

.manual {

    border-top:
        1px solid
        #333;

    padding-top: 30px;

    text-align: center;

}

.manual-titulo {

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 10px;

}

.manual-sub {

    color: #aaa;

    font-size: 17px;

    margin-bottom: 20px;

}

.manual-form {

    display: flex;

    gap: 12px;

    justify-content: center;

}

#inputID {

    width: 100%;

    max-width: 500px;

    padding: 18px;

    border-radius: 15px;

    border:
        2px solid
        #555;

    background: #111;

    color: white;

    font-size: 22px;

    text-align: center;

    outline: none;

}

#inputID:focus {

    border-color: #ff202a;

}

.btn-buscar {

    min-width: 150px;

}


/* =====================================================
   RESULTADO
===================================================== */

#resultado {

    margin-top: 30px;

}


/* =====================================================
   TARJETA SOCIO
===================================================== */

.tarjeta-socio {

    border:
        2px solid
        #333;

    border-radius: 25px;

    padding: 25px;

    background:
        linear-gradient(
            145deg,
            #151515,
            #080808
        );

}


/* =====================================================
   DATOS
===================================================== */

.datos-superiores {

    display: flex;

    gap: 25px;

    align-items: center;

}


.foto-container {

    width: 220px;

    min-width: 220px;

    height: 280px;

    border-radius: 20px;

    overflow: hidden;

    background: #111;

}

.foto-socio {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


.datos-socio {

    flex: 1;

}

.nombre {

    font-weight: 900;

    margin-bottom: 15px;

}


.id-socio {

    display: inline-block;

    background: #e21b23;

    border-radius: 10px;

    padding:
        8px
        18px;

    font-size: 25px;

    font-weight: 900;

    margin-bottom: 20px;

}


.dato {

    padding:
        12px
        0;

    border-bottom:
        1px solid
        #292929;

}

.dato span {

    display: block;

    color: #999;

    font-size: 14px;

    margin-bottom: 4px;

}

.dato strong {

    font-size: 22px;

}


/* =====================================================
   ESTADO ACCESO
===================================================== */

.estado-acceso {

    margin-top: 25px;

    padding: 22px;

    border-radius: 18px;

    text-align: center;

    font-size: 30px;

    font-weight: 900;

}

.estado-acceso.permitido {

    color: #25ff45;

    border:
        2px solid
        #20a830;

    background:
        rgba(0,120,0,.15);

}

.estado-acceso.denegado {

    color: #ff3030;

    border:
        2px solid
        #aa2222;

    background:
        rgba(120,0,0,.15);

}


/* =====================================================
   ERROR SOCIO
===================================================== */

.error-socio {

    text-align: center;

    border:
        2px solid
        #d82029;

    border-radius: 20px;

    padding: 30px;

}

.error-socio h2 {

    color: #ff4141;

    font-size: 30px;

}

.error-socio p {

    color: #aaa;

    font-size: 18px;

}


/* =====================================================
   ESTADISTICAS
===================================================== */

.estadisticas {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-top: 30px;

}

.stat {

    text-align: center;

    padding: 25px 10px;

    border:
        2px solid
        #333;

    border-radius: 20px;

    background: #0c0c0c;

}

.stat-numero {

    font-size: 42px;

    font-weight: 900;

}

.stat-titulo {

    color: #aaa;

    font-size: 16px;

    margin-top: 5px;

}

.stat.permitidas .stat-numero {

    color: #22ff45;

}

.stat.denegadas .stat-numero {

    color: #ff3030;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align: center;

    margin-top: 35px;

    color: #777;

    font-size: 17px;

    letter-spacing: 3px;

}

.footer span {

    color: #e21b23;

}


/* =====================================================
   CANVAS OCULTO
===================================================== */

#canvas {

    display: none;

}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 700px) {


    .contenedor {

        padding:
            15px
            12px
            40px;

    }


    .logo-principal {

        font-size: 50px;

        letter-spacing: 5px;

    }


    .logo-sub {

        font-size: 14px;

        letter-spacing: 5px;

    }


    .titulo {

        font-size: 28px;

        margin-top: 25px;

    }


    .panel {

        padding: 15px;

        border-radius: 22px;

    }


    .titulo-escaner {

        font-size: 27px;

    }


    #video {

        min-height: 250px;

    }


    .estado-principal {

        font-size: 24px;

    }


    .estado-sub {

        font-size: 15px;

    }


    .botones {

        flex-direction: column;

    }


    button {

        width: 100%;

        font-size: 21px;

    }


    .manual-form {

        flex-direction: column;

    }


    #inputID {

        max-width: none;

        font-size: 22px;

    }


    .btn-buscar {

        width: 100%;

    }


    .datos-superiores {

        flex-direction: column;

    }


    .foto-container {

        width: 100%;

        max-width: 300px;

        height: 350px;

    }

    }

    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 400px) {

    .logo-principal {

        font-size: 42px;

    }

    .titulo {

        font-size: 24px;

    }

    .titulo-escaner {

        font-size: 23px;

    }

}

</style>

<script>

/* =====================================================
   CONFIGURACION
===================================================== */


/*
   ESTA ES TU URL ACTUAL DE APPS SCRIPT
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwVF61K5oldfMH1murcWrLTKjzrR78MwmBHPb4mA6kv3X2SjEKwXrRSfwSxkid7IrD_/exec";


/* =====================================================
   ELEMENTOS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


const estado =
    document.getElementById("estado");

const estadoPrincipal =
    document.getElementById("estadoPrincipal");

const estadoSub =
    document.getElementById("estadoSub");

const inputID =
    document.getElementById("inputID");

const botonBuscar =
    document.getElementById("buscar");

const botonAbrir =
    document.getElementById("abrirCamara");

const botonDetener =
    document.getElementById("detenerCamara");

const resultado =
    document.getElementById("resultado");


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let escaneando = false;

let ultimoQR = "";

let ultimoQRTiempo = 0;


/* =====================================================
   ESTADO
===================================================== */

function cambiarEstado(
    principal,
    secundario,
    tipo
) {

    estadoPrincipal.innerText =
        principal;

    estadoSub.innerText =
        secundario || "";


    estado.className =
        "estado " +
        (tipo || "");

}


/* =====================================================
   EXTRAER ID
===================================================== */

function extraerID(texto) {

    if (!texto) {
        return "";
    }


    texto =
        String(texto)
            .trim();


    /*
       QR DIRECTO

       Ejemplo:

       B001
    */

    if (
        /^[A-Za-z0-9_-]+$/.test(texto)
    ) {

        return texto
            .toUpperCase();

    }


    /*
       QR COMO URL

       Ejemplo:

       https://.../?id=B001
    */

    try {

        const url =
            new URL(texto);

        const id =
            url.searchParams.get("id");


        if (id) {

            return id
                .trim()
                .toUpperCase();

        }

    }

    catch (error) {

        console.log(
            "No es URL:",
            texto
        );

    }


    /*
       BUSCAR id=
    */

    const encontrado =
        texto.match(
            /id=([A-Za-z0-9_-]+)/i
        );


    if (encontrado) {

        return encontrado[1]
            .toUpperCase();

    }


    return texto
        .toUpperCase();

}


/* =====================================================
   CONSULTAR SOCIO
===================================================== */

function consultarSocio(id) {

    id =
        String(id || "")
            .trim()
            .toUpperCase();


    if (!id) {

        cambiarEstado(
            "🔴 ID VACÍO",
            "Ingresá el ID del socio",
            "error"
        );

        return;

    }


    cambiarEstado(
        "🟡 CONSULTANDO...",
        "Buscando " + id,
        "buscando"
    );


    /*
       Nombre único para JSONP
    */

    const callbackName =
        "borosCallback_" +
        Date.now();


    const script =
        document.createElement("script");


    let terminado = false;


    /*
       FUNCION QUE RECIBE
       LA RESPUESTA DE APPS SCRIPT
    */

    window[callbackName] =
        function(data) {

            terminado = true;


            console.log(
                "RESPUESTA APPS SCRIPT:",
                data
            );


            try {

                if (!data) {

                    throw new Error(
                        "Respuesta vacía"
                    );

                }


                if (
                    data.encontrado === false
                ) {

                    cambiarEstado(
                        "🔴 SOCIO NO ENCONTRADO",
                        data.mensaje ||
                        "Verificá el ID",
                        "error"
                    );


                    mostrarNoEncontrado();

                    return;

                }


                if (
                    data.encontrado === true
                ) {

                    mostrarSocio(data);


                    if (
                        data.estado === "VIGENTE"
                    ) {

                        cambiarEstado(
                            "🟢 ACCESO PERMITIDO",
                            "Entrada registrada correctamente",
                            "ok"
                        );

                    }

                    else {

                        cambiarEstado(
                            "🔴 ACCESO DENEGADO",
                            "La membresía está vencida",
                            "error"
                        );

                    }


                    return;

                }


                cambiarEstado(
                    "🔴 RESPUESTA INVÁLIDA",
                    "Apps Script respondió algo inesperado",
                    "error"
                );

            }

            catch (error) {

                console.error(
                    error
                );

                cambiarEstado(
                    "🔴 ERROR",
                    error.message,
                    "error"
                );

            }

            finally {

                limpiar();

            }

        };


    /*
       URL JSONP
    */

    script.src =
        API_URL +
        "?api=1" +
        "&id=" +
        encodeURIComponent(id) +
        "&callback=" +
        encodeURIComponent(callbackName);


    /*
       SI NO CARGA EL SCRIPT
    */

    script.onerror =
        function() {

            if (terminado) {
                return;
            }


            console.error(
                "No se pudo cargar Apps Script"
            );


            cambiarEstado(
                "🔴 NO SE PUDO CONECTAR",
                "No se pudo comunicar con Apps Script",
                "error"
            );


            limpiar();

        };


    /*
       SEGURIDAD
    */

    const timeout =
        setTimeout(
            function() {

                if (terminado) {
                    return;
                }


                cambiarEstado(
                    "🔴 TIEMPO AGOTADO",
                    "Apps Script no respondió",
                    "error"
                );


                limpiar();

            },
            15000
        );


    function limpiar() {

        clearTimeout(timeout);


        try {

            delete window[callbackName];

        }

        catch (e) {}


        if (
            script.parentNode
        ) {

            script.parentNode
                .removeChild(script);

        }

    }


    document.body.appendChild(
        script
    );

}


/* =====================================================
   MOSTRAR SOCIO
===================================================== */

function mostrarSocio(socio) {

    let foto = "";


    if (
        socio.foto &&
        socio.foto.datos &&
        socio.foto.tipo
    ) {

        foto =
            `
            <img
                class="foto-socio"
                src="data:${socio.foto.tipo};base64,${socio.foto.datos}"
            >
            `;

    }


    const vigente =
        socio.estado === "VIGENTE";


    resultado.innerHTML =

        `
        <div class="tarjeta-socio">

            <div class="datos-superiores">


                <div class="foto-container">

                    ${foto}

                </div>


                <div class="datos-socio">


                    <div class="nombre">

                        ${
                            socio.nombre || ""
                        }

                        ${
                            socio.apellido || ""
                        }

                    </div>


                    <div class="id-socio">

                        ${
                            socio.id || ""
                        }

                    </div>


                    <div class="dato">

                        <span>
                            PLAN
                        </span>

                        <strong>
                            ${
                                socio.plan || "-"
                            }
                        </strong>

                    </div>


                    <div class="dato">

                        <span>
                            INICIO
                        </span>

                        <strong>
                            ${
                                socio.inicio || "-"
                            }
                        </strong>

                    </div>


                    <div class="dato">

                        <span>
                            VENCIMIENTO
                        </span>

                        <strong>
                            ${
                                socio.vencimiento || "-"
                            }
                        </strong>

                    </div>


                    <div class="dato">

                        <span>
                            DNI
                        </span>

                        <strong>
                            ${
                                socio.dni || "-"
                            }
                        </strong>

                    </div>


                </div>


            </div>


            <div
                class="estado-acceso
                ${
                    vigente
                    ? "permitido"
                    : "denegado"
                }"
            >

                ${
                    vigente
                    ? "✓ ACCESO PERMITIDO"
                    : "✕ ACCESO DENEGADO"
                }

            </div>


        </div>
        `;


    /*
       Actualizar estadísticas
    */

    const entradas =
        document.getElementById(
            "entradasHoy"
        );

    const permitidas =
        document.getElementById(
            "permitidas"
        );

    const denegadas =
        document.getElementById(
            "denegadas"
        );


    let e =
        parseInt(
            entradas.innerText
        ) || 0;


    let p =
        parseInt(
            permitidas.innerText
        ) || 0;


    let d =
        parseInt(
            denegadas.innerText
        ) || 0;


    e++;


    if (vigente) {
        p++;
    }

    else {
        d++;
    }


    entradas.innerText = e;

    permitidas.innerText = p;

    denegadas.innerText = d;

}


/* =====================================================
   NO ENCONTRADO
===================================================== */

function mostrarNoEncontrado() {

    resultado.innerHTML =

        `
        <div class="error-socio">

            <div
                style="
                    font-size:60px;
                    color:#ff3030;
                "
            >
                ✕
            </div>

            <h2>
                SOCIO NO ENCONTRADO
            </h2>

            <p>
                Verificá que el ID sea correcto.
            </p>

        </div>
        `;

}


/* =====================================================
   BUSQUEDA MANUAL
===================================================== */

function buscarManual() {

    const id =
        inputID.value
            .trim();


    if (!id) {

        cambiarEstado(
            "🔴 FALTA EL ID",
            "Ingresá algo como B001",
            "error"
        );

        inputID.focus();

        return;

    }


    /*
       Detener cámara mientras
       consultamos
    */

    detenerCamara();


    consultarSocio(id);

}


/* =====================================================
   BOTON BUSCAR
===================================================== */

botonBuscar.addEventListener(
    "click",
    buscarManual
);


/* =====================================================
   ENTER
===================================================== */

inputID.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            buscarManual();

        }

    }
);


/* =====================================================
   ABRIR CAMARA
===================================================== */

async function abrirCamara() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "El navegador no permite acceder a la cámara."
            );

        }


        cambiarEstado(
            "🟡 ABRIENDO CÁMARA...",
            "Esperá un momento",
            "buscando"
        );


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        escaneando = true;


        botonAbrir.style.display =
            "none";


        botonDetener.style.display =
            "block";


        cambiarEstado(
            "🟢 LISTO PARA ESCANEAR",
            "Presentá el QR del socio frente a la cámara",
            "ok"
        );


        escanear();

    }

    catch (error) {

        console.error(
            "CAMARA:",
            error
        );


        cambiarEstado(
            "🔴 NO SE PUDO ACCEDER A LA CÁMARA",
            error.message ||
            "Revisá los permisos del navegador",
            "error"
        );

    }

}


/* =====================================================
   DETENER CAMARA
===================================================== */

function detenerCamara() {

    escaneando = false;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        stream = null;

    }


    if (video) {

        video.srcObject =
            null;

    }


    botonAbrir.style.display =
        "block";


    botonDetener.style.display =
        "none";

}


botonAbrir.addEventListener(
    "click",
    abrirCamara
);


botonDetener.addEventListener(
    "click",
    function() {

        detenerCamara();


        cambiarEstado(
            "⚪ CÁMARA DETENIDA",
            "Presioná ABRIR CÁMARA para volver a utilizarla",
            ""
        );

    }
);


/* =====================================================
   ESCANEAR QR
===================================================== */

function escanear() {

    if (!escaneando) {
        return;
    }


    if (
        video.readyState <
        2
    ) {

        requestAnimationFrame(
            escanear
        );

        return;

    }


    const ancho =
        video.videoWidth;

    const alto =
        video.videoHeight;


    if (
        !ancho ||
        !alto
    ) {

        requestAnimationFrame(
            escanear
        );

        return;

    }


    canvas.width =
        ancho;

    canvas.height =
        alto;


    ctx.drawImage(
        video,
        0,
        0,
        ancho,
        alto
    );


    /*
       jsQR
    */

    try {

        if (
            typeof jsQR ===
            "function"
        ) {

            const imagen =
                ctx.getImageData(
                    0,
                    0,
                    ancho,
                    alto
                );


            const codigo =
                jsQR(
                    imagen.data,
                    imagen.width,
                    imagen.height,
                    {
                        inversionAttempts:
                            "attemptBoth"
                    }
                );


            if (
                codigo &&
                codigo.data
            ) {

                procesarQR(
                    codigo.data
                );

                return;

            }

        }

    }

    catch (error) {

        console.log(
            "Error jsQR:",
            error
        );

    }


    /*
       Continuar escaneando
    */

    if (escaneando) {

        requestAnimationFrame(
            escanear
        );

    }

}


/* =====================================================
   PROCESAR QR
===================================================== */

function procesarQR(texto) {

    const ahora =
        Date.now();


    /*
       Evitar leer el mismo QR
       muchas veces
    */

    if (
        texto === ultimoQR &&
        ahora - ultimoQRTiempo < 3000
    ) {

        return;

    }


    ultimoQR =
        texto;

    ultimoQRTiempo =
        ahora;


    console.log(
        "QR DETECTADO:",
        texto
    );


    const id =
        extraerID(texto);


    if (!id) {

        cambiarEstado(
            "🔴 QR INVÁLIDO",
            "No se pudo obtener el ID",
            "error"
        );

        return;

    }


    escaneando = false;


    cambiarEstado(
        "🟢 QR DETECTADO",
        "ID: " + id,
        "buscando"
    );


    consultarSocio(id);

}


/* =====================================================
   ESTADO INICIAL
===================================================== */

cambiarEstado(
    "🟢 LISTO PARA ESCANEAR",
    "Presentá el QR del socio frente a la cámara",
    "ok"
);
