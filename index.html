<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boros Gym - Control de Acceso</title>

<!-- Lector QR -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.contenedor {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 25px 20px 40px;
}

/* =========================
   LOGO
========================= */

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo-principal {
    font-size: clamp(55px, 9vw, 95px);
    font-weight: 900;
    font-style: italic;
    letter-spacing: 8px;
    line-height: 0.9;
}

.logo-sub {
    margin-top: 12px;
    color: #ff4b4b;
    font-size: clamp(14px, 2.5vw, 24px);
    font-weight: bold;
    letter-spacing: 7px;
}

/* =========================
   TITULO
========================= */

.titulo {
    text-align: center;
    font-size: clamp(32px, 6vw, 58px);
    font-weight: 900;
    margin: 35px 0;
}

/* =========================
   ESCANER
========================= */

.scanner-card {
    width: 100%;
    border: 4px solid #ff2020;
    border-radius: 35px;
    padding: 25px;
    background: #080808;
    box-shadow: 0 0 30px rgba(255,0,0,.25);
}

.scanner-titulo {
    text-align: center;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    margin-bottom: 25px;
}

#reader {
    width: 100%;
    max-width: 850px;
    margin: auto;
    border-radius: 25px;
    overflow: hidden;
    background: #111;
}

/* Oculta algunos textos/botones propios del lector */
#reader img {
    max-width: 100%;
}

#reader video {
    width: 100% !important;
    height: auto !important;
    border-radius: 20px;
}

.estado {
    text-align: center;
    margin-top: 25px;
    font-size: clamp(24px, 5vw, 42px);
    font-weight: 900;
    color: #00ed45;
}

.ayuda {
    text-align: center;
    margin-top: 10px;
    color: #bbb;
    font-size: clamp(16px, 3vw, 24px);
}

/* =========================
   CONTROLES
========================= */

.controles {
    margin-top: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
}

.boton {
    border: none;
    border-radius: 18px;
    padding: 18px 28px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    color: white;
    background: #ed1c24;
}

.boton:hover {
    background: #ff3030;
}

.boton.secundario {
    background: #222;
    border: 2px solid #555;
}

.manual {
    margin-top: 30px;
    padding-top: 25px;
    border-top: 2px solid #333;
}

.manual-titulo {
    text-align: center;
    font-size: clamp(20px, 4vw, 30px);
    margin-bottom: 15px;
    color: #ddd;
}

.manual-contenedor {
    display: flex;
    gap: 12px;
}

#idManual {
    flex: 1;
    min-width: 0;
    background: #111;
    color: white;
    border: 2px solid #555;
    border-radius: 15px;
    padding: 18px;
    font-size: 22px;
    text-transform: uppercase;
}

#buscarManual {
    background: #ed1c24;
    color: white;
    border: none;
    border-radius: 15px;
    padding: 0 28px;
    font-size: 20px;
    font-weight: 900;
}

/* =========================
   RESULTADO
========================= */

#resultado {
    margin-top: 25px;
}

.socio-card {
    background: #101010;
    border: 3px solid #333;
    border-radius: 30px;
    padding: 25px;
}

.socio-contenido {
    display: flex;
    align-items: center;
    gap: 30px;
}

.foto-container {
    width: 300px;
    flex-shrink: 0;
}

.foto {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 22px;
    border: 4px solid #e51b23;
}

.datos {
    flex: 1;
}

.nombre {
    font-size: clamp(28px, 5vw, 45px);
    font-weight: 900;
    margin-bottom: 20px;
}

.dato {
    padding: 12px 0;
    border-bottom: 1px solid #333;
    font-size: clamp(18px, 3vw, 25px);
}

.dato span {
    display: block;
    color: #888;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.acceso {
    margin-top: 25px;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    font-size: clamp(28px, 6vw, 45px);
    font-weight: 900;
}

.acceso small {
    display: block;
    margin-top: 10px;
    color: #bbb;
    font-size: 18px;
    font-weight: normal;
}

.permitido {
    color: #00ed45;
    border: 3px solid #00a832;
    background: rgba(0,180,60,.10);
}

.denegado {
    color: #ff3030;
    border: 3px solid #b00000;
    background: rgba(180,0,0,.10);
}

.error {
    background: #150000;
    border: 3px solid #d00000;
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
    color: #ff4040;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 900;
}

/* =========================
   ESTADISTICAS
========================= */

.estadisticas {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.estadistica {
    background: #101010;
    border: 2px solid #333;
    border-radius: 20px;
    padding: 20px 10px;
    text-align: center;
    color: #999;
    font-size: 15px;
    font-weight: bold;
}

.numero {
    display: block;
    margin-top: 8px;
    color: white;
    font-size: 38px;
    font-weight: 900;
}

.verde {
    color: #00ed45;
}

.rojo {
    color: #ff3030;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 30px;
    color: #777;
    font-size: 15px;
    letter-spacing: 3px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 650px) {

    .contenedor {
        padding: 18px 10px 30px;
    }

    .scanner-card {
        padding: 12px;
        border-radius: 25px;
    }

    .scanner-titulo {
        margin-bottom: 15px;
    }

    #reader {
        border-radius: 18px;
    }

    .socio-contenido {
        flex-direction: column;
    }

    .foto-container {
        width: 85%;
        max-width: 330px;
    }

    .datos {
        width: 100%;
        text-align: center;
    }

    .dato {
        text-align: left;
    }

    .manual-contenedor {
        flex-direction: column;
    }

    #buscarManual {
        min-height: 60px;
    }

    .estadisticas {
        gap: 7px;
    }

    .estadistica {
        padding: 15px 5px;
        font-size: 11px;
    }

    .numero {
        font-size: 30px;
    }
}

</style>
</head>

<body>

<div class="contenedor">

    <!-- LOGO -->
    <div class="logo">

        <div class="logo-principal">
            BOROS
        </div>

        <div class="logo-sub">
            STRENGTH & FITNESS
        </div>

    </div>

    <div class="titulo">
        CONTROL DE ACCESO
    </div>


    <!-- =========================
         ESCANER
    ========================== -->

    <div class="scanner-card">

        <div class="scanner-titulo">
            📷 ESCÁNER QR
        </div>

        <div id="reader"></div>

        <div id="estadoCamara" class="estado">
            PREPARANDO CÁMARA...
        </div>

        <div class="ayuda">
            Presentá el QR del socio frente a la cámara
        </div>

        <div class="controles">

            <button
                class="boton"
                id="abrirCamara">
                📷 ABRIR CÁMARA
            </button>

            <button
                class="boton secundario"
                id="detenerCamara">
                ⏹️ DETENER
            </button>

        </div>


        <!-- =========================
             CONSULTA MANUAL
        ========================== -->

        <div class="manual">

            <div class="manual-titulo">
                Si el QR no funciona, ingresá el ID del socio manualmente
            </div>

            <div class="manual-contenedor">

                <input
                    id="idManual"
                    type="text"
                    placeholder="Ejemplo: B001"
                    autocomplete="off">

                <button
                    id="buscarManual">
                    🔎 BUSCAR
                </button>

            </div>

        </div>

    </div>


    <!-- RESULTADO -->

    <div id="resultado"></div>


    <!-- ESTADISTICAS -->

    <div class="estadisticas">

        <div class="estadistica">
            ENTRADAS HOY
            <span
                id="entradasHoy"
                class="numero">
                0
            </span>
        </div>

        <div class="estadistica">
            PERMITIDAS
            <span
                id="permitidas"
                class="numero verde">
                0
            </span>
        </div>

        <div class="estadistica">
            DENEGADAS
            <span
                id="denegadas"
                class="numero rojo">
                0
            </span>
        </div>

    </div>


    <div class="footer">
        BOROS • FUERZA • DISCIPLINA • RESULTADOS
    </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

/*
   ESTA ES LA URL NUEVA DE TU APPS SCRIPT
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwVF61K5oldfMH1murcWrLTKjzrR78MwmBHPb4mA6kv3X2SjEKwXrRSfwSxkid7IrD_/exec";


/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let camaraActiva = false;

let procesando = false;

let entradasHoy = 0;

let permitidas = 0;

let denegadas = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const estadoCamara =
    document.getElementById("estadoCamara");

const resultado =
    document.getElementById("resultado");

const idManual =
    document.getElementById("idManual");


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara() {

    if (camaraActiva) {
        return;
    }

    estadoCamara.innerText =
        "🟡 SOLICITANDO CÁMARA...";

    estadoCamara.style.color =
        "#ffd000";

    try {

        scanner =
            new Html5Qrcode("reader");

        await scanner.start(

            {
                facingMode: {
                    ideal: "environment"
                }
            },

            {
                fps: 15,

                qrbox: function(width, height) {

                    const tamaño =
                        Math.floor(
                            Math.min(width, height) * 0.85
                        );

                    return {
                        width: tamaño,
                        height: tamaño
                    };
                },

                aspectRatio: 1.7777778,

                disableFlip: false,

                formatsToSupport: [
                    Html5QrcodeSupportedFormats.QR_CODE
                ],

                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }

            },

            function(decodedText) {

                console.log(
                    "📷 QR DETECTADO:",
                    decodedText
                );

                if (procesando) {
                    return;
                }

                procesando = true;

                estadoCamara.innerText =
                    "🟡 QR DETECTADO";

                estadoCamara.style.color =
                    "#ffd000";

                procesarQR(decodedText);

            },

            function(errorMessage) {

                // El lector sigue buscando.
                // No mostramos cada error porque
                // html5-qrcode genera muchos mientras busca.

                console.log(
                    "Buscando QR..."
                );

            }

        );

        camaraActiva = true;

        estadoCamara.innerText =
            "🟢 LISTO PARA ESCANEAR";

        estadoCamara.style.color =
            "#00ed45";

    }

    catch(error) {

        console.error(
            "ERROR CÁMARA:",
            error
        );

        estadoCamara.innerText =
            "🔴 NO SE PUDO ACCEDER A LA CÁMARA";

        estadoCamara.style.color =
            "#ff3030";

        resultado.innerHTML =
            '<div class="error">' +
            '📷<br><br>' +
            'NO SE PUDO ACCEDER A LA CÁMARA' +
            '<br><br>' +
            '<small>' +
            'Revisá los permisos de cámara del navegador.' +
            '</small>' +
            '</div>';

        procesando = false;
    }
}


/* =====================================================
   DETENER CÁMARA
===================================================== */

async function detenerCamara() {

    if (!scanner) {
        return;
    }

    try {

        if (camaraActiva) {

            await scanner.stop();

        }

        scanner.clear();

    }

    catch(error) {

        console.log(
            "Error deteniendo cámara:",
            error
        );

    }

    scanner = null;

    camaraActiva = false;

    estadoCamara.innerText =
        "⚪ CÁMARA DETENIDA";

    estadoCamara.style.color =
        "#aaa";
}


/* =====================================================
   PROCESAR QR
===================================================== */

function procesarQR(textoQR) {

  estado.innerHTML = "🟡 LEYENDO QR...";
  estado.className = "estado";
  subestado.innerHTML = "Consultando información del socio...";

  let id = String(textoQR || "").trim();

  // Si el QR contiene una URL, intentar obtener ?id=
  try {
    const url = new URL(id);
    const parametro = url.searchParams.get("id");

    if (parametro) {
      id = parametro.trim();
    }
  } catch (e) {
    // El QR puede contener directamente B001
  }

  if (!id) {
    mostrarErrorConexion();
    return;
  }

  console.log("ID DETECTADO:", id);

  // Nombre único para la función de respuesta
  const callbackName =
    "borosCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);

  let terminado = false;

  // Función que recibe la respuesta de Apps Script
  window[callbackName] = function(data) {

    if (terminado) return;

    terminado = true;

    console.log("RESPUESTA DE APPS SCRIPT:", data);

    try {

      mostrarResultado(data);

    } catch (error) {

      console.error(
        "ERROR PROCESANDO RESPUESTA:",
        error
      );

      mostrarErrorConexion();

    }

    limpiar();

  };

  // Crear script para JSONP
  const script =
    document.createElement("script");

  script.id = callbackName;

  script.async = true;

  script.src =
    API_URL +
    "?api=1" +
    "&id=" +
    encodeURIComponent(id) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  console.log(
    "CONSULTANDO APPS SCRIPT:",
    script.src
  );

  // Si el navegador no puede cargar Apps Script
  script.onerror = function(error) {

    if (terminado) return;

    terminado = true;

    console.error(
      "ERROR CARGANDO APPS SCRIPT:",
      error
    );

    mostrarErrorConexion();

    limpiar();

  };

  // Tiempo máximo de espera
  const temporizador =
    setTimeout(function() {

      if (terminado) return;

      terminado = true;

      console.error(
        "APPS SCRIPT NO RESPONDIÓ EN 15 SEGUNDOS"
      );

      mostrarErrorConexion();

      limpiar();

    }, 15000);


  function limpiar() {

    clearTimeout(temporizador);

    if (window[callbackName]) {
      delete window[callbackName];
    }

    const elemento =
      document.getElementById(callbackName);

    if (elemento) {
      elemento.remove();
    }

  }


  document.body.appendChild(script);

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(respuesta) {

    if (!respuesta) {

        mostrarError(
            "NO SE RECIBIÓ RESPUESTA"
        );

        procesando = false;

        return;
    }


    console.log(
        "RESULTADO:",
        respuesta
    );


    /*
       SOCIO NO ENCONTRADO
    */

    if (!respuesta.encontrado) {

        entradasHoy++;

        denegadas++;

        actualizarEstadisticas();

        mostrarError(
            respuesta.mensaje ||
            "SOCIO NO ENCONTRADO"
        );

        finalizarConsulta();

        return;
    }


    /*
       SOCIO ENCONTRADO
    */

    entradasHoy++;


    if (respuesta.permitido) {

        permitidas++;

    }

    else {

        denegadas++;

    }


    actualizarEstadisticas();


    /*
       FOTO
    */

    let fotoHTML = "";


    if (
        respuesta.foto &&
        respuesta.foto.datos
    ) {

        const tipo =
            respuesta.foto.tipo ||
            "image/jpeg";

        fotoHTML =

            '<div class="foto-container">' +

            '<img ' +

            'class="foto" ' +

            'src="data:' +

            tipo +

            ';base64,' +

            respuesta.foto.datos +

            '" ' +

            'alt="Foto del socio">' +

            '</div>';
    }


    /*
       ESTADO
    */

    const permitido =
        Boolean(
            respuesta.permitido
        );


    const claseEstado =
        permitido
        ? "permitido"
        : "denegado";


    const icono =
        permitido
        ? "🟢"
        : "🔴";


    const texto =
        permitido
        ? "ACCESO PERMITIDO"
        : "ACCESO DENEGADO";


    const mensaje =
        permitido
        ? "Entrada registrada correctamente"
        : "Membresía vencida";


    /*
       MOSTRAR TARJETA
    */

    resultado.innerHTML =

        '<div class="socio-card">' +

        '<div class="socio-contenido">' +

        fotoHTML +

        '<div class="datos">' +

        '<div class="nombre">' +

        escaparHTML(
            respuesta.nombre || ""
        ) +

        " " +

        escaparHTML(
            respuesta.apellido || ""
        ) +

        '</div>' +


        '<div class="dato">' +

        '<span>ID SOCIO</span>' +

        escaparHTML(
            respuesta.id || ""
        ) +

        '</div>' +


        '<div class="dato">' +

        '<span>PLAN</span>' +

        escaparHTML(
            respuesta.plan || ""
        ) +

        '</div>' +


        '<div class="dato">' +

        '<span>VENCIMIENTO</span>' +

        escaparHTML(
            respuesta.vencimiento || ""
        ) +

        '</div>' +


        '<div class="dato">' +

        '<span>DNI</span>' +

        escaparHTML(
            respuesta.dni || ""
        ) +

        '</div>' +


        '</div>' +

        '</div>' +


        '<div class="acceso ' +

        claseEstado +

        '">' +

        icono +

        " " +

        texto +

        '<small>' +

        mensaje +

        '</small>' +

        '</div>' +

        '</div>';


    /*
       Después de mostrar el resultado,
       volvemos al escáner.
    */

    setTimeout(
        finalizarConsulta,
        5000
    );
}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(valor) {

    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   ERROR
===================================================== */

function mostrarError(mensaje) {

    resultado.innerHTML =

        '<div class="error">' +

        '🔴<br><br>' +

        escaparHTML(
            mensaje
        ) +

        '</div>';
}


/* =====================================================
   FINALIZAR CONSULTA
===================================================== */

async function finalizarConsulta() {

    procesando = false;

    /*
       Limpiamos el campo manual
    */

    idManual.value = "";


    /*
       Volvemos a iniciar la cámara
    */

    if (!camaraActiva) {

        setTimeout(
            iniciarCamara,
            1000
        );
    }
}


/* =====================================================
   ESTADISTICAS
===================================================== */

function actualizarEstadisticas() {

    document.getElementById(
        "entradasHoy"
    ).innerText =
        entradasHoy;


    document.getElementById(
        "permitidas"
    ).innerText =
        permitidas;


    document.getElementById(
        "denegadas"
    ).innerText =
        denegadas;
}


/* =====================================================
   BUSQUEDA MANUAL
===================================================== */

function buscarManual() {

    const id =
        idManual.value
        .trim()
        .toUpperCase();


    if (!id) {

        mostrarError(
            "INGRESÁ EL ID DEL SOCIO"
        );

        return;
    }


    if (procesando) {

        return;
    }


    procesando = true;

    consultarSocio(id);
}


/* =====================================================
   BOTONES
===================================================== */

document
    .getElementById("abrirCamara")
    .addEventListener(
        "click",
        iniciarCamara
    );


document
    .getElementById("detenerCamara")
    .addEventListener(
        "click",
        detenerCamara
    );


document
    .getElementById("buscarManual")
    .addEventListener(
        "click",
        buscarManual
    );


idManual.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            buscarManual();
        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

window.addEventListener(
    "load",
    function() {

        /*
           En celular es mejor pedir
           la cámara después de que
           la página terminó de cargar.
        */

        setTimeout(
            iniciarCamara,
            700
        );

    }
);

</script>

</body>
</html>
