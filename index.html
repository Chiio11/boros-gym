<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boros Gym - Control de Acceso</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .contenedor {
      width: 100%;
      max-width: 1100px;
      padding: 25px 20px 50px;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-principal {
      font-size: clamp(42px, 8vw, 82px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 7px;
      line-height: 0.9;
      color: white;
      text-shadow:
        3px 3px 0 #e00000,
        -2px -2px 0 #e00000;
    }

    .logo-sub {
      margin-top: 10px;
      font-size: clamp(12px, 2vw, 20px);
      font-weight: bold;
      letter-spacing: 7px;
      color: #e00000;
    }

    .titulo {
      text-align: center;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 900;
      margin: 35px 0 25px;
      letter-spacing: 2px;
    }

    /* =========================
       ESCANER
    ========================= */

    .scanner-card {
      border: 3px solid #e00000;
      border-radius: 30px;
      padding: 25px;
      text-align: center;
      background: #0d0d0d;
      box-shadow:
        0 0 25px rgba(220, 0, 0, 0.35);
    }

    .scanner-titulo {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 750px;
      margin: auto;
      overflow: hidden;
      border-radius: 25px;
      min-height: 300px;
      background: #111;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 20px;
    }

    .estado {
      margin-top: 25px;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 900;
    }

    .estado.verde {
      color: #00ff33;
    }

    .estado.rojo {
      color: #ff2020;
    }

    .subestado {
      margin-top: 8px;
      color: #aaa;
      font-size: clamp(15px, 2.5vw, 22px);
    }

    /* =========================
       RESULTADO
    ========================= */

    #resultado {
      margin-top: 30px;
    }

    .resultado-card {
      background: #101010;
      border: 2px solid #333;
      border-radius: 30px;
      padding: 30px;
      display: flex;
      gap: 35px;
      align-items: center;
      text-align: left;
      box-shadow: 0 0 25px rgba(255,255,255,0.05);
    }

    .foto {
      width: 260px;
      height: 320px;
      object-fit: cover;
      border-radius: 22px;
      border: 3px solid #e00000;
      flex-shrink: 0;
    }

    .datos {
      flex: 1;
    }

    .nombre {
      font-size: clamp(28px, 5vw, 50px);
      font-weight: 900;
      margin-bottom: 25px;
    }

    .dato {
      font-size: clamp(18px, 3vw, 27px);
      padding: 14px 0;
      border-bottom: 1px solid #333;
    }

    .dato b {
      color: #999;
      display: block;
      font-size: 0.65em;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .acceso {
      margin-top: 30px;
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      font-size: clamp(25px, 4vw, 42px);
      font-weight: 900;
    }

    .permitido {
      color: #00ff33;
      border: 2px solid #00aa22;
      background: rgba(0, 255, 50, 0.08);
    }

    .denegado {
      color: #ff2020;
      border: 2px solid #aa0000;
      background: rgba(255, 0, 0, 0.08);
    }

    /* =========================
       ESTADISTICAS
    ========================= */

    .estadisticas {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .estadistica {
      background: #0d0d0d;
      border: 2px solid #333;
      border-radius: 22px;
      padding: 25px;
      text-align: center;
    }

    .numero {
      font-size: clamp(35px, 6vw, 60px);
      font-weight: 900;
    }

    .texto {
      margin-top: 5px;
      color: #aaa;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .numero.verde {
      color: #00ff33;
    }

    .numero.rojo {
      color: #ff2020;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #888;
      font-size: clamp(14px, 2vw, 20px);
      letter-spacing: 4px;
      font-weight: bold;
    }

    /* =========================
       MOVIL
    ========================= */

    @media (max-width: 700px) {

      .contenedor {
        padding: 20px 12px 35px;
      }

      .scanner-card {
        padding: 15px;
        border-radius: 22px;
      }

      #reader {
        min-height: 250px;
      }

      .resultado-card {
        flex-direction: column;
        padding: 20px;
        text-align: center;
      }

      .foto {
        width: min(80vw, 300px);
        height: min(95vw, 360px);
      }

      .datos {
        width: 100%;
      }

      .estadisticas {
        gap: 8px;
      }

      .estadistica {
        padding: 15px 5px;
      }

      .texto {
        font-size: 11px;
      }

    }

  </style>

  <!-- LECTOR QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="contenedor">

  <!-- LOGO -->

  <div class="logo">

    <div class="logo-principal">
      BOROS
    </div>

    <div class="logo-sub">
      STRENGTH & FITNESS
    </div>

  </div>


  <div class="titulo">
    CONTROL DE ACCESO
  </div>


  <!-- ESCANER -->

  <div class="scanner-card">

    <div class="scanner-titulo">
      📷 ESCÁNER QR
    </div>

    <div id="reader"></div>

    <div id="estado" class="estado verde">
      🟢 LISTO PARA ESCANEAR
    </div>

    <div id="subestado" class="subestado">
      Presentá el QR del socio frente a la cámara
    </div>

  </div>


  <!-- RESULTADO -->

  <div id="resultado"></div>


  <!-- ESTADISTICAS -->

  <div class="estadisticas">

    <div class="estadistica">

      <div id="entradas" class="numero">
        0
      </div>

      <div class="texto">
        Entradas hoy
      </div>

    </div>


    <div class="estadistica">

      <div id="permitidas" class="numero verde">
        0
      </div>

      <div class="texto">
        Permitidas
      </div>

    </div>


    <div class="estadistica">

      <div id="denegadas" class="numero rojo">
        0
      </div>

      <div class="texto">
        Denegadas
      </div>

    </div>

  </div>


  <div class="footer">
    BOROS • FUERZA • DISCIPLINA • RESULTADOS
  </div>

</div>


<script>

/* =====================================================
   URL DE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwWuTDND-A06UgrvhlZ5Uifo3YsiiuRHbVlPFAGXykmaVQR5h6IuPpehLCLP7KiJYXC/exec";


/* =====================================================
   VARIABLES
===================================================== */

let escaneando = true;

let entradas = 0;
let permitidas = 0;
let denegadas = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const estado =
document.getElementById("estado");

const subestado =
document.getElementById("subestado");

const resultado =
document.getElementById("resultado");


/* =====================================================
   ESCANEO QR
===================================================== */

function iniciarScanner() {

  const scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 300,
        height: 300
      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      if (!escaneando) return;

      escaneando = false;

      procesarQR(decodedText);

    },

    function(errorMessage) {

      // Ignorar errores normales del lector

    }

  )

  .catch(function(error) {

    estado.innerHTML =
      "🔴 NO SE PUDO ACCEDER A LA CÁMARA";

    estado.className =
      "estado rojo";

    subestado.innerHTML =
      "Comprobá que el navegador tenga permiso para usar la cámara.";

  });

}


/* =====================================================
   PROCESAR QR
===================================================== */

function procesarQR(textoQR) {

  estado.innerHTML =
    "🟡 LEYENDO QR...";

  estado.className =
    "estado";

  subestado.innerHTML =
    "Consultando información del socio...";


  /*
   * Extraer ID
   */

  let id = textoQR.trim();


  try {

    const url =
      new URL(textoQR);

    const parametro =
      url.searchParams.get("id");

    if (parametro) {

      id = parametro;

    }

  } catch (e) {

    // Si no es una URL, usamos directamente el texto

  }


  /*
   * JSONP
   */

  const callbackName =
    "borosCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        mostrarResultado(data);

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {

          script.remove();

        }

      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?api=1" +
    "&id=" +
    encodeURIComponent(id) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      mostrarErrorConexion();

    };


  document.body.appendChild(script);

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(data) {

  console.log("DATOS RECIBIDOS:", data);

  if (!data) {

    mostrarErrorConexion();

    return;

  }

  if (!data.encontrado) {

    estado.innerHTML =
      "🔴 SOCIO NO ENCONTRADO";

    estado.className =
      "estado rojo";

    subestado.innerHTML =
      data.mensaje ||
      "El ID no existe en la planilla.";

    resultado.innerHTML = "";

    escaneando = true;

    return;

  }



  if (!data.encontrado) {

    estado.innerHTML =
      "🔴 SOCIO NO ENCONTRADO";

    estado.className =
      "estado rojo";

    subestado.innerHTML =
      data.mensaje ||
      "El ID no existe en la planilla.";

    resultado.innerHTML = "";

    setTimeout(resetearScanner, 3500);

    return;

  }


  /*
   * Estadísticas
   */

  entradas++;


  if (data.permitido) {

    permitidas++;

  } else {

    denegadas++;

  }


  document.getElementById("entradas")
    .textContent = entradas;

  document.getElementById("permitidas")
    .textContent = permitidas;

  document.getElementById("denegadas")
    .textContent = denegadas;


  /*
   * Estado
   */

  if (data.permitido) {

    estado.innerHTML =
      "🟢 ACCESO PERMITIDO";

    estado.className =
      "estado verde";

  } else {

    estado.innerHTML =
      "🔴 ACCESO DENEGADO";

    estado.className =
      "estado rojo";

  }


  subestado.innerHTML =
    "Entrada registrada correctamente";


  /*
   * FOTO
   */

  let fotoHTML = "";


  if (
    data.foto &&
    data.foto.datos
  ) {

    fotoHTML =
      '<img class="foto" src="data:' +
      data.foto.tipo +
      ';base64,' +
      data.foto.datos +
      '" alt="Foto del socio">';

  } else {

    fotoHTML =
      '<div class="foto" style="display:flex;align-items:center;justify-content:center;font-size:60px;">👤</div>';

  }


  /*
   * RESULTADO
   */

  resultado.innerHTML =

    '<div class="resultado-card">' +

      fotoHTML +

      '<div class="datos">' +

        '<div class="nombre">' +
          (data.nombre || "") +
          " " +
          (data.apellido || "") +
        '</div>' +

        '<div class="dato">' +
          '<b>ID Socio</b>' +
          (data.id || "") +
        '</div>' +

        '<div class="dato">' +
          '<b>Plan</b>' +
          (data.plan || "") +
        '</div>' +

        '<div class="dato">' +
          '<b>Vencimiento</b>' +
          (data.vencimiento || "") +
        '</div>' +

        '<div class="dato">' +
          '<b>DNI</b>' +
          (data.dni || "") +
        '</div>' +

        '<div class="acceso ' +
          (data.permitido
            ? "permitido"
            : "denegado") +
        '">' +

          (
            data.permitido
              ? "✓ ACCESO PERMITIDO"
              : "✕ ACCESO DENEGADO"
          ) +

        '</div>' +

      '</div>' +

    '</div>';


  /*
   * Volver a escanear
   */

  setTimeout(
    resetearScanner,
    5000
  );

}


/* =====================================================
   ERROR DE CONEXION
===================================================== */

function mostrarErrorConexion() {

  estado.innerHTML =
    "🔴 NO SE PUDO CONECTAR CON EL SISTEMA";

  estado.className =
    "estado rojo";

  subestado.innerHTML =
    "Revisá la conexión con Apps Script.";

  resultado.innerHTML = "";

  setTimeout(
    resetearScanner,
    4000
  );

}


/* =====================================================
   RESETEAR
===================================================== */

function resetearScanner() {

  escaneando = true;

  estado.innerHTML =
    "🟢 LISTO PARA ESCANEAR";

  estado.className =
    "estado verde";

  subestado.innerHTML =
    "Presentá el QR del socio frente a la cámara";

}


/* =====================================================
   INICIAR
===================================================== */

window.addEventListener(
  "load",
  iniciarScanner
);

</script>

</body>
</html>
